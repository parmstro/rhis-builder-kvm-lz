---
vms:
  - vmname: idm1.domain.test
    target_host: infra1
    vcpu: 1
    memory: 8192
    network:
      hostname: "idm1"
      domain: "domain.test"
      mac: "52:54:00:aa:bb:01"
      ipv4_address: "10.10.10.100"
      ipv4_netmask: "255.255.255.0"
      ipv4_gateway: "10.10.10.1"
      name_server1: "8.8.8.8"
      name_server2: "8.8.4.4"
    root_enc_pass: "{{ encrypted_root_pass_vault }}"
    grub_enc_pass: "{{ encrypted_grub_pass_vault }}"
    username: "ansiblerunner"
    user_enc_pass: "{{ encrypted_user_pass_vault }}"
    user_sudoer_policy: "{{ user_sudoer_policy_vault }}"
    ssh_pub_key: "{{ ssh_pub_key_vault }}"
    fs:
      filesystem: "xfs"
      # We will always use compliance layout
      boot_mb: 1024
      boot_efi_mb: 2048
      lv_root_mb: 65536
      lv_home_mb: 20480
      lv_tmp_mb: 6144
      lv_var_tmp_mb: 6144
      lv_var_log_mb: 6144
      lv_var_log_audit_mb: 6144
      lv_var_mb: 1
    disks:
      - name: idm1_os1
        disk:
          capacity: 100
          bus: virtio
          volume_mode: filesystem
      - name: idm1_data1
        disk:
          capacity: 500
          bus: scsi
          volume_mode: block
    redhat:
      org: "12345678"
      activation_key: "redhat-activation-keyname"

