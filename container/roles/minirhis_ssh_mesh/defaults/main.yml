---
# Defaults for rhis_ssh_mesh role

# The user that Ansible (and the installer host) will use for management SSH.
rhis_mesh_user: admin

# Private key used by the RHIS installer for all managed-SSH operations.
rhis_installer_key_path: "{{ ansible_env.HOME }}/.ssh/minirhis-installer/id_rsa"

# SSH mesh role mode:
# - bootstrap: build/refresh full node mesh and temporarily authorize installer key
# - finalize: remove temporary installer key trust from managed nodes
rhis_mesh_mode: bootstrap

# Users on installer host that should trust the installer key locally.
rhis_installer_host_users:
  - "{{ rhis_mesh_user }}"
  - "{{ ansible_user_id | default(ansible_user | default('admin')) }}"

# Users on managed nodes that receive the temporary installer key during bootstrap.
rhis_installer_remote_users:
  - "{{ rhis_mesh_user }}"
  - root

# SSH client config to deploy on every RHIS node so they can reach each other.
rhis_ssh_strict_checking: "no"

# Collect and distribute root public keys in addition to mesh_user keys.
# Useful for Ansible become and emergency recovery.
rhis_include_root_keys: false
