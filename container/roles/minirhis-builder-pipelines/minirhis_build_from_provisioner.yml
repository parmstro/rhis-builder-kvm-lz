---
- name: "Build platform_hosts defined in variables from within the container"
  hosts: provisioner
  become: true
  gather_facts: true
  connection: local # for container

  tasks:
    - name: "Load the vault variables"
      when: vault_path is defined
      ansible.builtin.include_vars:
        file: "{{ vault_path }}"

    - name: "Load the other variables"
      when: vars_path is defined
      ansible.builtin.include_vars:
        file: "{{ vars_path }}"

    - name: "Load the vault variables"
      when: vault_dir is defined
      ansible.builtin.include_vars:
        dir: "{{ vault_dir }}"

    - name: "Load the other variables"
      when: vars_dir is defined
      ansible.builtin.include_vars:
        dir: "{{ vars_dir }}"

    - name: "Resolve platform host list from a variable name"
      when:
        - platform_hosts is not defined
        - platform_hosts_var is defined
      ansible.builtin.set_fact:
        platform_hosts: "{{ lookup('ansible.builtin.vars', platform_hosts_var) }}"

    - name: "Validate platform host list input"
      when: platform_hosts is not defined
      ansible.builtin.fail:
        msg: >-
          Missing platform host list. Set platform_hosts directly or pass
          platform_hosts_var with a variable name such as aap24_hosts.

    - name: "Apply role platform_node_build"
      ansible.builtin.include_role:
        name: "platform_node_build"
      tags:
        - always
