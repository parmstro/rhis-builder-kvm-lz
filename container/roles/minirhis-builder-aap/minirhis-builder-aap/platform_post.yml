- name: "Configure the Ansible Automation Platform Controller"
  hosts: "platform_installer"
  become: true

  tasks:
    - name: "Load the vault variables"
      when: vault_path is defined
      ansible.builtin.include_vars:
        file: "{{ vault_path }}"

    - name: "Load the other variables"
      when: vars_path is defined
      ansible.builtin.include_vars:
        file: "{{ vars_path }}"

    - name: "Load the vault variables"
      when: vault_dir is defined
      ansible.builtin.include_vars:
        dir: "{{ vault_dir }}"

    - name: "Load the other variables"
      when: vars_dir is defined
      ansible.builtin.include_vars:
        dir: "{{ vars_dir }}"

    - name: "Add all AAP Content and Configuration"
      when:
        - (groups['aap_controllers'] | default([]) | length > 0) or
          (groups['platform_installer'] | default([]) | length > 0) or
          (groups['aap_hosts'] | default([]) | length > 0)
      ansible.builtin.include_role:
        name: platform_post
      tags:
        - tags_phase_4
        - tags_platform
        - tags_platform_post

    - name: "Configure RHIS Builder projects, credentials, and survey templates"
      when:
        - (groups['aap_controllers'] | default([]) | length > 0) or
          (groups['platform_installer'] | default([]) | length > 0) or
          (groups['aap_hosts'] | default([]) | length > 0)
      ansible.builtin.include_role:
        name: minirhis_aap_config
      tags:
        - tags_phase_4
        - tags_platform
        - tags_rhis_aap_config
