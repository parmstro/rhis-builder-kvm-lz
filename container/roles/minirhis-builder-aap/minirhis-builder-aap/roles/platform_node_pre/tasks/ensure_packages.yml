---

- name: "Ensure ansible-core"
  ansible.builtin.dnf:
    name:
      - "ansible-core"
    state: "present"

- name: "Ensure supporting packages"
  ansible.builtin.dnf:
    name:
      - "wget"
      - "git-core"
      - "rsync"
      - "vim"
      - "bzip2"
      - "gzip"
    state: "present"
    disable_gpg_check: true
    skip_broken: true
  register: aap_supporting_packages_install
  failed_when: false

- name: "Warn if supporting packages could not be installed"
  ansible.builtin.debug:
    msg: >-
      AAP prereq warning: one or more supporting packages were not installed.
      Continuing so remaining setup can proceed. Details: {{
      aap_supporting_packages_install.msg | default('n/a') }}
  when:
    - aap_supporting_packages_install is defined
    - aap_supporting_packages_install.failed | default(false) or
      (aap_supporting_packages_install.failures is defined and
      (aap_supporting_packages_install.failures | length > 0))
  changed_when: false

- name: "Bootstrap temporary EPEL tooling packages"
  when: rhis_aap_enable_epel_bootstrap | default(true) | bool
  block:
    - name: "Set EPEL release URL for current major version"
      ansible.builtin.set_fact:
        _rhis_aap_epel_release_url: "https://dl.fedoraproject.org/pub/epel/epel-release\
          -latest-{{ ansible_distribution_major_version }}.noarch.rpm"
      changed_when: false

    - name: "Install epel-release package"
      ansible.builtin.dnf:
        name: "{{ _rhis_aap_epel_release_url }}"
        state: present
      register: _rhis_aap_epel_release_install
      failed_when: false

    - name: "Enable EPEL repositories"
      ansible.builtin.shell: |
        set -o pipefail
        dnf config-manager --set-enabled epel >/dev/null 2>&1 || true
        dnf config-manager --set-enabled epel-testing >/dev/null 2>&1 || true
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false

    - name: "Install requested EPEL ansible tooling packages"
      ansible.builtin.dnf:
        name: "{{ rhis_aap_epel_tooling_packages | default(['ansible-collection*',
          'ansible-packaging', 'vim-ansible']) }}"
        state: present
        enablerepo: "epel"
        skip_broken: true
      register: _rhis_aap_epel_tooling_install
      failed_when: false

    - name: "Warn when AAP EPEL tooling install is partial or failed"
      ansible.builtin.debug:
        msg: >-
          AAP EPEL tooling bootstrap completed with warnings. epel-release
          msg={{ _rhis_aap_epel_release_install.msg | default('n/a') }}; package
          msg={{ _rhis_aap_epel_tooling_install.msg | default('n/a') }}
      when:
        - (_rhis_aap_epel_release_install.failed | default(false)) or
          (_rhis_aap_epel_tooling_install.failed | default(false)) or
          ((_rhis_aap_epel_tooling_install.failures | default([])) | length > 0)
      changed_when: false

  always:
    - name: "Disable EPEL repositories"
      ansible.builtin.shell: |
        set -o pipefail
        dnf config-manager --set-disabled epel >/dev/null 2>&1 || true
        dnf config-manager --set-disabled epel-testing >/dev/null 2>&1 || true
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false
