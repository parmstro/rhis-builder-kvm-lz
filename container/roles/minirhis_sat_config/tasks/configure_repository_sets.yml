---
# tasks/configure_repository_sets.yml — rhis_sat_config
# Enable repository sets for RHEL 9/10, Satellite client, HA, and AAP 2.6.

- name: "Enable repository sets for each RHEL major"
  ansible.builtin.include_tasks:
    file: enable_repo_set_item.yml
    apply:
      tags:
        - tags_sat_config_repos
  vars:
    _repo_sets_effective: >-
      {{
        (rhis_sat_config_repo_sets | selectattr('optional', 'equalto', false) | list)
        +
        ((rhis_sat_config_enable_optional_repo_sets | bool)
          | ternary((rhis_sat_config_repo_sets | selectattr('optional', 'equalto', true) | list), []))
      }}
  loop: "{{ _repo_sets_effective | product(rhis_sat_config_rhel_majors) | list }}"
  when: (item.0.rhel_majors is not defined) or (item.1 in item.0.rhel_majors)
  loop_control:
    label: "{{ item.0.product }} / {{ item.1 }}"
  tags:
    - tags_sat_config_repos
