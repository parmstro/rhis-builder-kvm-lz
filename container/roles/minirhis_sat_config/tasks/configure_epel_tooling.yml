---
# tasks/configure_epel_tooling.yml — rhis_sat_config
# Temporarily enable EPEL on Satellite, install requested tooling, then disable EPEL.

- name: "Skip Satellite EPEL tooling bootstrap when disabled"
  when: not (rhis_sat_config_enable_epel_bootstrap | default(true) | bool)
  ansible.builtin.debug:
    msg: "Satellite EPEL tooling bootstrap disabled by
      rhis_sat_config_enable_epel_bootstrap=false"
  changed_when: false
  tags:
    - tags_sat_config_packages

- name: "Bootstrap temporary EPEL tooling on Satellite"
  when: rhis_sat_config_enable_epel_bootstrap | default(true) | bool
  block:
    - name: "Set EPEL release URL for current major version"
      ansible.builtin.set_fact:
        _rhis_sat_epel_release_url: "https://dl.fedoraproject.org/pub/epel/epel-release\
          -latest-{{ ansible_distribution_major_version }}.noarch.rpm"
      changed_when: false

    - name: "Install epel-release package"
      ansible.builtin.dnf:
        name: "{{ _rhis_sat_epel_release_url }}"
        state: present
        disable_gpg_check: true
      register: _rhis_sat_epel_release_install
      failed_when: false

    - name: "Enable EPEL repositories"
      ansible.builtin.shell: |
        set -o pipefail
        dnf config-manager --set-enabled epel >/dev/null 2>&1 || true
        dnf config-manager --set-enabled epel-testing >/dev/null 2>&1 || true
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false

    - name: "Install EPEL ansible tooling packages"
      ansible.builtin.dnf:
        name: "{{ rhis_sat_config_epel_tooling_packages }}"
        state: present
        enablerepo: "epel"
        skip_broken: true
      register: _rhis_sat_epel_tooling_install
      failed_when: false

    - name: "Warn when Satellite EPEL tooling install is partial or failed"
      ansible.builtin.debug:
        msg: >-
          Satellite EPEL tooling bootstrap completed with warnings. epel-release
          msg={{ _rhis_sat_epel_release_install.msg | default('n/a') }}; package
          msg={{ _rhis_sat_epel_tooling_install.msg | default('n/a') }}
      when:
        - (_rhis_sat_epel_release_install.failed | default(false)) or
          (_rhis_sat_epel_tooling_install.failed | default(false)) or
          ((_rhis_sat_epel_tooling_install.failures | default([])) | length > 0)
      changed_when: false

  always:
    - name: "Disable EPEL repositories"
      ansible.builtin.shell: |
        set -o pipefail
        dnf config-manager --set-disabled epel >/dev/null 2>&1 || true
        dnf config-manager --set-disabled epel-testing >/dev/null 2>&1 || true
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false
  tags:
    - tags_sat_config_packages
