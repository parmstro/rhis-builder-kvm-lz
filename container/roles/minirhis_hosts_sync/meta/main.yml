---
galaxy_info:
  role_name: rhis_hosts_sync
  author: RHIS Team
  description: >
    Manages the RHIS-owned block in /etc/hosts on the installer host, using
    blockinfile with a uniquely-named marker so the block is idempotent and
    never stomps on other /etc/hosts entries.
  license: Apache-2.0
  min_ansible_version: "2.14"
  platforms:
    - name: EL
      versions:
        - "9"
        - "10"
    - name: Fedora
      versions:
        - all
dependencies: []
