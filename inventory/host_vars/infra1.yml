---
host:
  hostname: infra1
  domain: domain.test
  # Primary NIC MAC address - configured during kickstart
  # Libvirt bridge will be created on second NIC with active link
  mac: "aa:bb:cc:dd:ee:01"
  ipv4_address: "10.10.10.51"
  ipv4_netmask: "255.255.255.0"
  ipv4_gateway: "10.10.10.1"
  name_server1: "8.8.8.8"
  name_server2: "8.8.4.4"

  # Disk Configuration - Using disk-by-id for stable device naming
  # Boot disk (typically SATA/SAS for OS)
  # Note: Kickstart will auto-detect Dell BOSS device if present, these values are fallback
  boot_disk: "disk/by-id/wwn-0x5000c500a1b2c3d4"
  root_disk: "disk/by-id/wwn-0x5000c500a1b2c3d4"

  # Additional NVMe disks for RAID 10 array (post-install)
  # These will be used by mdadm to create the RAID array
  # These MUST exist, otherwise kickstart will fail
  additional_disks:
    - "disk/by-id/nvme-SAMSUNG_MZVL21T0HCLR-00B00_S675NE0R401234"
    - "disk/by-id/nvme-SAMSUNG_MZVL21T0HCLR-00B00_S675NE0R401235"
    - "disk/by-id/nvme-SAMSUNG_MZVL21T0HCLR-00B00_S675NE0R401236"
    - "disk/by-id/nvme-SAMSUNG_MZVL21T0HCLR-00B00_S675NE0R401237"

  # LVM Volume Sizing (MB)
  boot_mb: 1024
  boot_efi_mb: 600
  lv_root_mb: 20480      # 20 GB
  lv_home_mb: 10240      # 10 GB
  lv_tmp_mb: 10240       # 10 GB
  lv_var_tmp_mb: 10240   # 10 GB
  lv_var_log_mb: 20480   # 20 GB
  lv_var_log_audit_mb: 10240  # 10 GB
  lv_var_mb: 20480       # 20 GB (grows with remaining space)

  # Filesystem type (default: xfs)
  filesystem: "xfs"

  # Authentication Configuration
  # Generated with: python3 -c 'import crypt; print(crypt.crypt("YourPassword", crypt.mksalt(crypt.METHOD_SHA512)))'
  root_enc_pass: "$6$rounds=656000$YourSaltHere$YourHashHere"
  grub_enc_pass: ""  # Optional GRUB password

  # Provisioner User (deleted post-bootstrap)
  username: "ansiblerunner"
  user_enc_pass: "$6$rounds=656000$YourSaltHere$YourHashHere"
  ssh_pub_key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAACAQC... ansible@provisioner"
  user_sudoer_policy: "ansiblerunner ALL=(ALL) NOPASSWD: ALL"

  # Red Hat Subscription Manager
  org: "12345678"
  activation_key: "redhat-activation-keyname"
...
