---
# rhis_ssh_mesh/tasks/main.yml
# Bootstraps full pairwise SSH trust across all RHIS nodes AND the installer host.
#
# Phase 1 (localhost): Ensure installer host has a dedicated RHIS SSH keypair.
# Phase 2 (rhis_nodes): Generate an SSH keypair for each node's mesh_user.
# Phase 3 (rhis_nodes): Collect all node public keys via facts.
# Phase 4 (rhis_nodes + installer): Distribute all public keys everywhere.
# Phase 5 (rhis_nodes): Deploy permissive SSH client config (StrictChecking=no).

# ── Phase 1: Installer host keypair ─────────────────────────────────────────

- name: "Phase 1 | Ensure RHIS installer keypair exists on localhost"
  when: inventory_hostname == 'localhost' or inventory_hostname == groups['installer'][0]
  block:

    - name: Ensure installer SSH key directory exists
      ansible.builtin.file:
        path: "{{ rhis_installer_key_path | dirname }}"
        state: directory
        mode: "0700"

    - name: Generate dedicated RHIS installer keypair (if absent)
      community.crypto.openssh_keypair:
        path: "{{ rhis_installer_key_path }}"
        type: rsa
        size: 4096
        comment: "rhis-installer-{{ inventory_hostname }}"
        state: present
      register: installer_keypair

    - name: Read installer public key
      ansible.builtin.slurp:
        src: "{{ rhis_installer_key_path }}.pub"
      register: installer_pub_raw

    - name: Set installer public key fact
      ansible.builtin.set_fact:
        rhis_installer_pub_key: "{{ installer_pub_raw.content | b64decode | trim }}"
        cacheable: false

# ── Phase 2: Generate per-node SSH keypairs ──────────────────────────────────

- name: "Phase 2 | Generate {{ rhis_mesh_user }} SSH keypair on each RHIS node"
  when: inventory_hostname in groups['rhis_nodes']
  block:

    - name: Ensure .ssh directory for {{ rhis_mesh_user }}
      ansible.builtin.file:
        path: "~{{ rhis_mesh_user }}/.ssh"
        state: directory
        mode: "0700"
        owner: "{{ rhis_mesh_user }}"
        group: "{{ rhis_mesh_user }}"
      become: true

    - name: Generate SSH keypair for {{ rhis_mesh_user }}
      community.crypto.openssh_keypair:
        path: "~{{ rhis_mesh_user }}/.ssh/id_rsa"
        type: rsa
        size: 4096
        owner: "{{ rhis_mesh_user }}"
        group: "{{ rhis_mesh_user }}"
        comment: "rhis-mesh-{{ inventory_hostname }}"
        state: present
      become: true
      become_user: "{{ rhis_mesh_user }}"

    - name: Fetch {{ rhis_mesh_user }} public key
      ansible.builtin.slurp:
        src: "~{{ rhis_mesh_user }}/.ssh/id_rsa.pub"
      register: node_pub_raw
      become: true

    - name: Set per-node public key fact (globally accessible)
      ansible.builtin.set_fact:
        rhis_node_pub_key: "{{ node_pub_raw.content | b64decode | trim }}"
        cacheable: false

# ── Phase 3: Aggregate all public keys ───────────────────────────────────────

- name: "Phase 3 | Aggregate all RHIS node public keys"
  when: inventory_hostname in groups['rhis_nodes']
  ansible.builtin.set_fact:
    rhis_all_pub_keys: >-
      {{
        groups['rhis_nodes']
        | map('extract', hostvars, 'rhis_node_pub_key')
        | select('defined')
        | list
        + ([hostvars[groups['installer'][0]]['rhis_installer_pub_key']]
           if hostvars[groups['installer'][0]]['rhis_installer_pub_key'] is defined
           else [])
      }}
    cacheable: false

# ── Phase 4: Distribute all public keys ──────────────────────────────────────

- name: "Phase 4 | Authorize all RHIS keys on each node ({{ rhis_mesh_user }})"
  when: inventory_hostname in groups['rhis_nodes']
  ansible.posix.authorized_key:
    user: "{{ rhis_mesh_user }}"
    key: "{{ item }}"
    state: present
    exclusive: false
  loop: "{{ rhis_all_pub_keys | default([]) }}"
  become: true

- name: "Phase 4 | Authorize all RHIS keys on installer host"
  when:
    - inventory_hostname == 'localhost' or inventory_hostname == groups['installer'][0]
    - item is defined and item | length > 0
  ansible.posix.authorized_key:
    user: "{{ ansible_user_id }}"
    key: "{{ item }}"
    state: present
    exclusive: false
  loop: >-
    {{
      groups['rhis_nodes']
      | map('extract', hostvars, 'rhis_node_pub_key')
      | select('defined')
      | list
    }}

# ── Phase 5: Deploy permissive SSH client config on each node ─────────────────

- name: "Phase 5 | Deploy SSH client config on RHIS nodes"
  when: inventory_hostname in groups['rhis_nodes']
  ansible.builtin.copy:
    dest: "~{{ rhis_mesh_user }}/.ssh/config"
    owner: "{{ rhis_mesh_user }}"
    group: "{{ rhis_mesh_user }}"
    mode: "0600"
    content: |
      Host *
          StrictHostKeyChecking {{ rhis_ssh_strict_checking }}
          UserKnownHostsFile /dev/null
          LogLevel ERROR
          IdentityFile ~/.ssh/id_rsa
  become: true
  become_user: "{{ rhis_mesh_user }}"
