[defaults]
inventory = /home/sgallego/GIT/RHIS/container/roles/inventory/hosts.yml
host_key_checking = False
retry_files_enabled = False
roles_path = /home/sgallego/GIT/RHIS/container/roles:/home/sgallego/GIT/RHIS/container/roles/minirhis-builder-satellite/roles:/home/sgallego/GIT/RHIS/container/roles/minirhis-builder-idm/roles:/home/sgallego/GIT/RHIS/container/roles/minirhis-builder-aap/roles:/home/sgallego/GIT/RHIS/container/roles/minirhis-builder-aap/minirhis-builder-aap/roles
stdout_callback = ansible.builtin.default
result_format = yaml
interpreter_python = auto_silent
remote_tmp = /var/tmp
forks = 15
timeout = 30
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /home/sgallego/.ansible/conf/facts-cache
fact_caching_timeout = 86400
callbacks_enabled = ansible.posix.profile_tasks,ansible.posix.timer
bin_ansible_callbacks = True
log_path = /home/sgallego/.ansible/conf/ansible-provisioner.log
nocows = 1
inject_facts_as_vars = True

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ForwardX11=no -i ~/.ssh/id_rsa
control_path_dir = /tmp/.ansible-cp
retries = 3

[galaxy]
server_list = published, validated, community_galaxy

[galaxy_server.published]
url = https://console.redhat.com/api/automation-hub/content/published/
auth_url = https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
# token sourced from vaulted var vault_console_redhat_token (fallback HUB_TOKEN)
token =

[galaxy_server.validated]
url = https://console.redhat.com/api/automation-hub/content/validated/
auth_url = https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
# token sourced from vaulted var vault_console_redhat_token (fallback HUB_TOKEN)
token =

[galaxy_server.community_galaxy]
url = https://galaxy.ansible.com/
