---
# tasks/create_customer_credentials.yml — minirhis_aap_config
#
# Creates a complete, namespaced AAP credential set for a single customer or
# project environment — completely separate from the MiniRHIS infrastructure
# layer credentials.
#
# Required inputs (extra_vars or include_vars from the customer vault file):
#   aap_customer_name         — identifier, e.g. "ACME"
#   aap_customer_env          — environment tag, e.g. "PROD", "DEV"
#
# Credential values sourced from customer_* variables loaded from
# ~/.ansible/conf/customers/<CUSTOMER>-<ENV>.yml (vault-encrypted).
#
# After this runs, AAP will contain:
#   <CUST>-<ENV> Machine Credential
#   <CUST>-<ENV> Vault Credential
#   <CUST>-<ENV> Red Hat CDN
#   <CUST>-<ENV> Automation Hub Token
#   <CUST>-<ENV> Red Hat Registry
#   <CUST>-<ENV> Environment Variables

- name: "Customer Credentials | Derive name prefix and org"
  ansible.builtin.set_fact:
    _cust_prefix: "{{ (aap_customer_name | upper) + '-' + (aap_customer_env | upper) }}"
    _cust_org: >-
      {{
        (aap_customer_name | upper)
        if (aap_customer_create_org | default(false) | bool)
        else aap_config_organization
      }}
  tags: rhis_aap_customer_credentials

# ── Optional: dedicated organization per customer ────────────────────────────
- name: "Customer Credentials | Ensure organization '{{ aap_customer_name | upper
    }}'"
  when: aap_customer_create_org | default(false) | bool
  ansible.controller.organization:
    controller_host: "{{ aap_config_platform_host }}"
    controller_username: "{{ aap_config_username }}"
    controller_password: "{{ aap_config_password }}"
    validate_certs: "{{ aap_config_validate_certs }}"
    name: "{{ aap_customer_name | upper }}"
    description: "Organization for {{ aap_customer_name }} customer environments"
    state: present
  tags: rhis_aap_customer_credentials

# ── Machine Credential ────────────────────────────────────────────────────────
- name: "Customer Credentials | Ensure '{{ _cust_prefix }} Machine Credential'"
  ansible.controller.credential:
    controller_host: "{{ aap_config_platform_host }}"
    controller_username: "{{ aap_config_username }}"
    controller_password: "{{ aap_config_password }}"
    validate_certs: "{{ aap_config_validate_certs }}"
    name: "{{ _cust_prefix }} Machine Credential"
    description: "SSH + sudo access for {{ _cust_prefix }} nodes"
    credential_type: "Machine"
    organization: "{{ _cust_org }}"
    inputs:
      username: "{{ customer_admin_user | default('admin') }}"
      password: "{{ customer_admin_pass | default('') }}"
      ssh_key_data: "{{ customer_ssh_key | default('') }}"
      become_method: "sudo"
      become_password: "{{ customer_admin_pass | default('') }}"
    state: present
  no_log: true
  tags: rhis_aap_customer_credentials

# ── Vault Credential ──────────────────────────────────────────────────────────
# Uses a per-customer vault password when provided; falls back to the MiniRHIS
# operator vault so the file can always be decrypted by the provisioner.
- name: "Customer Credentials | Ensure '{{ _cust_prefix }} Vault Credential'"
  ansible.controller.credential:
    controller_host: "{{ aap_config_platform_host }}"
    controller_username: "{{ aap_config_username }}"
    controller_password: "{{ aap_config_password }}"
    validate_certs: "{{ aap_config_validate_certs }}"
    name: "{{ _cust_prefix }} Vault Credential"
    description: "Ansible Vault decryption password for {{ _cust_prefix }} encrypted files"
    credential_type: "Vault"
    organization: "{{ _cust_org }}"
    inputs:
      vault_password: >-
        {{
          customer_vault_password
          if (customer_vault_password | default('') | length > 0)
          else lookup('file', aap_config_vault_pass_path)
        }}
    state: present
  no_log: true
  tags: rhis_aap_customer_credentials

# ── Red Hat CDN Credential ────────────────────────────────────────────────────
- name: "Customer Credentials | Ensure '{{ _cust_prefix }} Red Hat CDN'"
  ansible.controller.credential:
    controller_host: "{{ aap_config_platform_host }}"
    controller_username: "{{ aap_config_username }}"
    controller_password: "{{ aap_config_password }}"
    validate_certs: "{{ aap_config_validate_certs }}"
    name: "{{ _cust_prefix }} Red Hat CDN"
    description: "Red Hat Customer Portal credentials for {{ _cust_prefix }}"
    credential_type: "Red Hat CDN"
    organization: "{{ _cust_org }}"
    inputs:
      rh_username: "{{ customer_rh_user | default('') }}"
      rh_password: "{{ customer_rh_pass | default('') }}"
      rh_offline_token: "{{ customer_rh_offline_token | default('') }}"
    state: present
  no_log: true
  tags: rhis_aap_customer_credentials

# ── Automation Hub Token ──────────────────────────────────────────────────────
- name: "Customer Credentials | Ensure '{{ _cust_prefix }} Automation Hub Token'"
  ansible.controller.credential:
    controller_host: "{{ aap_config_platform_host }}"
    controller_username: "{{ aap_config_username }}"
    controller_password: "{{ aap_config_password }}"
    validate_certs: "{{ aap_config_validate_certs }}"
    name: "{{ _cust_prefix }} Automation Hub Token"
    description: "Automation Hub token for {{ _cust_prefix }} collection downloads"
    credential_type: "Ansible Galaxy/Automation Hub API Token"
    organization: "{{ _cust_org }}"
    inputs:
      url: "https://console.redhat.com/api/automation-hub/"
      auth_url: "https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-c\
        onnect/token"
      token: "{{ customer_hub_token | default(customer_rh_offline_token | default(''))
        }}"
    state: present
  no_log: true
  tags: rhis_aap_customer_credentials

# ── Container Registry Credential ────────────────────────────────────────────
- name: "Customer Credentials | Ensure '{{ _cust_prefix }} Red Hat Registry'"
  ansible.controller.credential:
    controller_host: "{{ aap_config_platform_host }}"
    controller_username: "{{ aap_config_username }}"
    controller_password: "{{ aap_config_password }}"
    validate_certs: "{{ aap_config_validate_certs }}"
    name: "{{ _cust_prefix }} Red Hat Registry"
    description: "registry.redhat.io pull credential for {{ _cust_prefix }}"
    credential_type: "Container Registry"
    organization: "{{ _cust_org }}"
    inputs:
      host: "registry.redhat.io"
      username: "{{ customer_rh_user | default('') }}"
      password: "{{ customer_rh_pass | default('') }}"
      verify_ssl: true
    state: present
  no_log: true
  tags: rhis_aap_customer_credentials

# ── Environment Variables Credential (topology injector) ─────────────────────
- name: "Customer Credentials | Ensure '{{ _cust_prefix }} Environment Variables'"
  ansible.controller.credential:
    controller_host: "{{ aap_config_platform_host }}"
    controller_username: "{{ aap_config_username }}"
    controller_password: "{{ aap_config_password }}"
    validate_certs: "{{ aap_config_validate_certs }}"
    name: "{{ _cust_prefix }} Environment Variables"
    description: "RHIS topology and environment variables for {{ _cust_prefix }}"
    credential_type: "RHIS Platform Installer"
    organization: "{{ _cust_org }}"
    inputs:
      rhis_domain: "{{ customer_domain | default('') }}"
      rhis_realm: "{{ customer_realm | default('') }}"
      rhis_sat_org: "{{ customer_sat_org | default('') }}"
      rhis_sat_loc: "{{ customer_sat_loc | default('HQ') }}"
      rhis_sat_hostname: "{{ customer_sat_hostname | default('') }}"
      rhis_aap_hostname: "{{ customer_aap_hostname | default('') }}"
      rhis_idm_hostname: "{{ customer_idm_hostname | default('') }}"
      rhis_cdn_org_id: "{{ customer_cdn_organization_id | default('') }}"
      rhis_cdn_activation_key: "{{ customer_cdn_sat_activation_key | default('') }}"
    state: present
  no_log: true
  tags: rhis_aap_customer_credentials

- name: "Customer Credentials | Summary"
  ansible.builtin.debug:
    msg: >-
      Created credential set for {{ _cust_prefix }} in organization '{{
      _cust_org }}':
        - {{ _cust_prefix }} Machine Credential
        - {{ _cust_prefix }} Vault Credential
        - {{ _cust_prefix }} Red Hat CDN
        - {{ _cust_prefix }} Automation Hub Token
        - {{ _cust_prefix }} Red Hat Registry
        - {{ _cust_prefix }} Environment Variables
  tags: rhis_aap_customer_credentials
