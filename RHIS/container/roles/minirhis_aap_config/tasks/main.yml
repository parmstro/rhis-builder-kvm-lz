---
# tasks/main.yml — minirhis_aap_config
# Orchestrate the RHIS AAP Controller configuration:
#   1. Custom credential types
#   2. RHIS infrastructure credentials (sourced from operator env.yml)
#   3. Inventory + SCM-backed inventory source
#   4. Projects (one per rhis-* repository)
#   5. Job templates (one per deployable project)
#   6. Global environment survey workflow template
#   7. Customer onboarding templates + workflow
#
# Credential isolation model:
#   Layer 1 — RHIS infrastructure (steps 1-2):
#     "RHIS *" credentials sourced from operator ~/.ansible/conf/env.yml.
#     Used exclusively by MiniRHIS component management playbooks.
#   Layer 2 — Customer / project (step 7):
#     "<CUSTOMER>-<ENV> *" credentials sourced from per-customer vault files.
#     Created at runtime via the "RHIS | Customer | Onboard New Environment"
#     workflow.  Completely isolated from Layer 1.

- name: "RHIS AAP Config | Ensure custom credential types"
  ansible.builtin.include_tasks: "configure_credential_types.yml"
  tags:
    - rhis_aap_config
    - rhis_aap_credential_types

- name: "RHIS AAP Config | Ensure credentials"
  ansible.builtin.include_tasks: "configure_credentials.yml"
  tags:
    - rhis_aap_config
    - rhis_aap_credentials

- name: "RHIS AAP Config | Ensure inventory and SCM source"
  ansible.builtin.include_tasks: "configure_inventory.yml"
  tags:
    - rhis_aap_config
    - rhis_aap_inventory

- name: "RHIS AAP Config | Ensure projects"
  ansible.builtin.include_tasks: "configure_projects.yml"
  tags:
    - rhis_aap_config
    - rhis_aap_projects

- name: "RHIS AAP Config | Ensure job templates"
  ansible.builtin.include_tasks: "configure_templates.yml"
  tags:
    - rhis_aap_config
    - rhis_aap_templates

- name: "RHIS AAP Config | Ensure global survey workflow"
  ansible.builtin.include_tasks: "configure_survey_workflow.yml"
  tags:
    - rhis_aap_config
    - rhis_aap_survey

- name: "RHIS AAP Config | Ensure customer onboarding templates and workflow"
  ansible.builtin.include_tasks: "configure_customer_onboarding.yml"
  tags:
    - rhis_aap_config
    - rhis_aap_customer_onboarding
