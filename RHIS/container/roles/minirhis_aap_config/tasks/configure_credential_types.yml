---
# tasks/configure_credential_types.yml — minirhis_aap_config
# Ensures all custom AAP credential types required by RHIS are present.

- name: "RHIS AAP Config | Ensure credential type '{{ ctype.name }}'"
  ansible.controller.credential_type:
    controller_host: "{{ aap_config_platform_host }}"
    controller_username: "{{ aap_config_username }}"
    controller_password: "{{ aap_config_password }}"
    validate_certs: "{{ aap_config_validate_certs }}"
    name: "{{ ctype.name }}"
    description: "{{ ctype.description | default(omit) }}"
    kind: "{{ ctype.kind | default('cloud') }}"
    inputs: "{{ ctype.inputs }}"
    injectors: "{{ ctype.injectors }}"
    state: "{{ ctype.state | default('present') }}"
  loop: "{{ aap_config_credential_types }}"
  loop_control:
    loop_var: ctype
    label: "{{ ctype.name }}"
  no_log: false
