---
# tasks/configure_credentials.yml — minirhis_aap_config
# Creates all RHIS credentials in the AAP Controller.
# Sensitive fields (ssh_key_data, vault_password, tokens) are resolved at
# task execution time via lookup() calls defined in defaults/main.yml.

- name: "RHIS AAP Config | Ensure credential '{{ cred.name }}'"
  ansible.controller.credential:
    controller_host: "{{ aap_config_platform_host }}"
    controller_username: "{{ aap_config_username }}"
    controller_password: "{{ aap_config_password }}"
    validate_certs: "{{ aap_config_validate_certs }}"
    name: "{{ cred.name }}"
    description: "{{ cred.description | default(omit) }}"
    credential_type: "{{ cred.credential_type }}"
    organization: "{{ cred.organization | default(aap_config_organization) }}"
    inputs: "{{ cred.inputs }}"
    state: "{{ cred.state | default('present') }}"
  loop: "{{ aap_config_credentials }}"
  loop_control:
    loop_var: cred
    label: "{{ cred.name }}"
  no_log: true
