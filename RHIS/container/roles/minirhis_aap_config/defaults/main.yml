---
# defaults/main.yml — minirhis_aap_config
# Provides idiomatic defaults for the RHIS AAP Controller configuration role.
# Values resolve from RHIS host_vars / vault-sourced env.yml; these are fallbacks.

# ─── AAP Controller connection ─────────────────────────────────────────────
aap_config_platform_host: "{{ aap_platform_host | default('https://' +
  (ansible_host | default(inventory_hostname))) }}"
aap_config_username: "{{ aap_platform_username | default(aap_admin_user |
  default(admin_user | default('admin'))) }}"
aap_config_password: "{{ aap_platform_password | default(aap_admin_password |
  default(global_admin_password | default(''))) }}"
aap_config_validate_certs: "{{ aap_validate_certs | default(false) | bool }}"
aap_config_organization: "{{ aap_organization | default('Default') }}"
aap_config_ee_name: "{{ aap_default_ee | default('Default execution environment') }}"

# Path to the minirhis-managed SSH private key (generated during VM provisioning).
# Falls back to the user's default RSA key when the minirhis key is absent.
aap_config_ssh_key_path: >-
  {{
    lookup('first_found', dict(files=[
      (playbook_dir + '/../vars/ssh/id_rsa'),
      '~/.ssh/minirhis-installer/id_rsa',
      '~/.ssh/id_rsa'
    ]))
  }}

aap_config_vault_pass_path: "{{ ansible_vault_password_file | default('~/.ansible/conf/.vaultpass.txt') }}"

# ─── Custom Credential Types ────────────────────────────────────────────────
# The injector templates use AWX-native {{ field_id }} syntax (evaluated at
# job run-time by AAP, not by Ansible).  The !unsafe tag prevents Ansible from
# interpreting them during the configuration playbook itself.
aap_config_credential_types:
  - name: "Red Hat CDN"
    kind: "cloud"
    description: "Red Hat Customer Portal / CDN access (username, password, offline token)"
    inputs:
      fields:
        - id: rh_username
          type: string
          label: "Red Hat Username"
          secret: false
        - id: rh_password
          type: string
          label: "Red Hat Password"
          secret: true
        - id: rh_offline_token
          type: string
          label: "Red Hat Offline Token"
          secret: true
          multiline: true
      required:
        - rh_username
        - rh_password
    injectors:
      extra_vars:
        rh_user: !unsafe "{{ rh_username }}"
        rh_pass: !unsafe "{{ rh_password }}"
        rh_offline_token: !unsafe "{{ rh_offline_token }}"

  - name: "RHIS Platform Installer"
    kind: "cloud"
    description: "Variables injected into RHIS deployment templates (domain, realm,
      org, IPs)"
    inputs:
      fields:
        - id: rhis_domain
          type: string
          label: "Domain (e.g. prod.spg)"
          secret: false
        - id: rhis_realm
          type: string
          label: "Kerberos Realm (e.g. PROD.SPG)"
          secret: false
        - id: rhis_sat_org
          type: string
          label: "Satellite Organization"
          secret: false
        - id: rhis_sat_loc
          type: string
          label: "Satellite Location"
          secret: false
        - id: rhis_sat_hostname
          type: string
          label: "Satellite FQDN"
          secret: false
        - id: rhis_aap_hostname
          type: string
          label: "AAP FQDN"
          secret: false
        - id: rhis_idm_hostname
          type: string
          label: "IdM FQDN"
          secret: false
        - id: rhis_cdn_org_id
          type: string
          label: "CDN Organization ID"
          secret: false
        - id: rhis_cdn_activation_key
          type: string
          label: "CDN / Satellite Activation Key"
          secret: false
      required:
        - rhis_domain
    injectors:
      extra_vars:
        domain: !unsafe "{{ rhis_domain }}"
        realm: !unsafe "{{ rhis_realm }}"
        sat_org: !unsafe "{{ rhis_sat_org }}"
        sat_loc: !unsafe "{{ rhis_sat_loc }}"
        sat_hostname: !unsafe "{{ rhis_sat_hostname }}"
        aap_hostname: !unsafe "{{ rhis_aap_hostname }}"
        idm_hostname: !unsafe "{{ rhis_idm_hostname }}"
        cdn_organization_id: !unsafe "{{ rhis_cdn_org_id }}"
        cdn_sat_activation_key: !unsafe "{{ rhis_cdn_activation_key }}"

# ─── Credentials ─────────────────────────────────────────────────────────────
# SCOPE: MiniRHIS infrastructure operator credentials only.
# These credentials are used exclusively by RHIS playbooks to install and
# maintain the Satellite / AAP / IdM nodes themselves.
# They are sourced from the operator's ~/.ansible/conf/env.yml vault file.
#
# Customer / project credentials are NOT defined here.  Each customer gets
# their own isolated credential set created by the onboarding workflow:
#   "RHIS | Customer | Onboard New Environment"
# which writes ~/.ansible/conf/customers/<CUSTOMER>-<ENV>.yml and calls
# provision_customer_credentials.yml to create <CUSTOMER>-<ENV> * in AAP.
aap_config_credentials:
  # --- Machine Credential ---------------------------------------------------
  - name: "RHIS Machine Credential"
    credential_type: "Machine"
    description: "SSH + sudo access for all RHIS-managed nodes (Satellite, AAP, IdM)"
    organization: "{{ aap_config_organization }}"
    inputs:
      username: "{{ admin_user | default('admin') }}"
      password: "{{ admin_pass | default(global_admin_password | default('')) }}"
      ssh_key_data: "{{ lookup('file', aap_config_ssh_key_path) }}"
      become_method: "sudo"
      become_password: "{{ admin_pass | default(global_admin_password | default('')) }}"

  # --- Vault Credential -----------------------------------------------------
  - name: "RHIS Vault Credential"
    credential_type: "Vault"
    description: "Ansible Vault decryption password for RHIS encrypted variables"
    organization: "{{ aap_config_organization }}"
    inputs:
      vault_password: "{{ lookup('file', aap_config_vault_pass_path) }}"

  # --- Source Control (GitHub, public repos) --------------------------------
  - name: "RHIS GitHub SCM"
    credential_type: "Source Control"
    description: "Source Control credential for parmstro GitHub repositories (public)"
    organization: "{{ aap_config_organization }}"
    inputs:
      username: ""
      password: ""

  # --- Red Hat CDN ----------------------------------------------------------
  - name: "RHIS Red Hat CDN"
    credential_type: "Red Hat CDN"
    description: "Red Hat Customer Portal / subscription access for all RHIS nodes"
    organization: "{{ aap_config_organization }}"
    inputs:
      rh_username: "{{ rh_user | default('') }}"
      rh_password: "{{ rh_pass | default('') }}"
      rh_offline_token: "{{ rh_offline_token | default('') }}"

  # --- Automation Hub Token -------------------------------------------------
  - name: "RHIS Automation Hub Token"
    credential_type: "Ansible Galaxy/Automation Hub API Token"
    description: "console.redhat.com Automation Hub offline token for collection downloads"
    organization: "{{ aap_config_organization }}"
    inputs:
      url: "https://console.redhat.com/api/automation-hub/"
      auth_url: "https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-c\
        onnect/token"
      token: "{{ hub_token | default(vault_console_redhat_token | default('')) }}"

  # --- Red Hat Registry -----------------------------------------------------
  - name: "RHIS Red Hat Registry"
    credential_type: "Container Registry"
    description: "registry.redhat.io pull credential for execution environment images"
    organization: "{{ aap_config_organization }}"
    inputs:
      host: "registry.redhat.io"
      username: "{{ rh_user | default('') }}"
      password: "{{ rh_pass | default('') }}"
      verify_ssl: true

  # --- RHIS Platform Installer Vars -----------------------------------------
  - name: "RHIS Environment Variables"
    credential_type: "RHIS Platform Installer"
    description: "Default RHIS environment topology values (domain, realm,
      hostnames, org, activation key)"
    organization: "{{ aap_config_organization }}"
    inputs:
      rhis_domain: "{{ domain | default('prod.spg') }}"
      rhis_realm: "{{ realm | default('PROD.SPG') }}"
      rhis_sat_org: "{{ sat_org | default('REDHAT') }}"
      rhis_sat_loc: "{{ sat_loc | default('CORE') }}"
      rhis_sat_hostname: "{{ sat_hostname | default('satellite.prod.spg') }}"
      rhis_aap_hostname: "{{ aap_hostname | default('aap.prod.spg') }}"
      rhis_idm_hostname: "{{ idm_hostname | default('idm.prod.spg') }}"
      rhis_cdn_org_id: "{{ cdn_organization_id | default('') }}"
      rhis_cdn_activation_key: "{{ cdn_sat_activation_key | default('') }}"

# ─── Inventories ─────────────────────────────────────────────────────────────
aap_config_inventories:
  - name: "RHIS Builder Inventory"
    description: "Dynamic inventory managed by rhis-builder-inventory across all
      RHIS deployment targets"
    organization: "{{ aap_config_organization }}"
    state: present

# ─── Inventory Sources ───────────────────────────────────────────────────────
aap_config_inventory_sources:
  - name: "RHIS Inventory — SCM"
    inventory: "RHIS Builder Inventory"
    source: scm
    source_project: "rhis-builder-inventory"
    source_path: "inventory/"
    scm_branch: "main"
    credential: "RHIS GitHub SCM"
    update_on_launch: true
    overwrite: true
    overwrite_vars: true
    description: "SCM-backed inventory sourced from parmstro/rhis-builder-inventory"
    state: present

# ─── Projects ────────────────────────────────────────────────────────────────
