# ─── Global Environment Survey Workflow ──────────────────────────────────────
# This workflow template collects all environment-specific parameters via an
# AAP survey and feeds them into the per-project build templates. It is the
# recommended entry point for deploying a new RHIS environment from scratch.
aap_config_survey_workflow:
  name: "RHIS | Deploy New Environment"
  description: >-
    Global survey-driven workflow for standing up a new RHIS environment.
    Collects hostnames, IPs, credentials, and deployment parameters via survey
    and passes them to the appropriate build templates in sequence.
  organization: "{{ aap_config_organization }}"
  inventory: "RHIS Builder Inventory"
  ask_variables_on_launch: true
  survey_enabled: true
  state: present
  survey_spec:
    name: "RHIS Environment Configuration Survey"
    description: "Provide environment-specific details for your new RHIS deployment"
    spec:
      # ----- Environment Identity -------------------------------------------
      - question_name: "Environment Domain"
        question_description: "DNS domain for this environment (e.g. prod.example.com)"
        required: true
        type: text
        variable: domain
        min: 3
        max: 253
        default: "prod.spg"

      - question_name: "Kerberos Realm"
        question_description: "Kerberos / IdM realm in uppercase (e.g. PROD.EXAMPLE.COM)"
        required: true
        type: text
        variable: realm
        min: 3
        max: 253
        default: "PROD.SPG"

      - question_name: "Satellite Organization"
        question_description: "Name of the Satellite organization to create or target"
        required: true
        type: text
        variable: sat_org
        min: 1
        max: 128
        default: "REDHAT"

      - question_name: "Satellite Location"
        question_description: "Name of the Satellite location"
        required: true
        type: text
        variable: sat_loc
        min: 1
        max: 128
        default: "CORE"

      # ----- Satellite Node -------------------------------------------------
      - question_name: "Satellite Hostname (FQDN)"
        question_description: "Fully qualified domain name for the Satellite server"
        required: true
        type: text
        variable: sat_hostname
        min: 3
        max: 253
        default: "satellite.prod.spg"

      - question_name: "Satellite IP Address"
        question_description: "IPv4 address of the Satellite node"
        required: true
        type: text
        variable: sat_ip
        min: 7
        max: 15
        default: "10.168.128.1"

      - question_name: "Satellite Admin Password"
        question_description: "Initial/current admin password for Satellite"
        required: true
        type: password
        variable: sat_admin_pass
        min: 8
        max: 128
        default: ""

      # ----- AAP Node -------------------------------------------------------
      - question_name: "AAP Hostname (FQDN)"
        question_description: "Fully qualified domain name for the Ansible Automation Platform node"
        required: true
        type: text
        variable: aap_hostname
        min: 3
        max: 253
        default: "aap.prod.spg"

      - question_name: "AAP IP Address"
        question_description: "IPv4 address of the AAP node"
        required: true
        type: text
        variable: aap_ip
        min: 7
        max: 15
        default: "10.168.128.2"

      - question_name: "AAP Admin Password"
        question_description: "Admin password for the AAP controller and gateway"
        required: true
        type: password
        variable: aap_admin_pass
        min: 8
        max: 128
        default: ""

      # ----- IdM Node -------------------------------------------------------
      - question_name: "IdM Hostname (FQDN)"
        question_description: "Fully qualified domain name for the IdM (FreeIPA) server"
        required: true
        type: text
        variable: idm_hostname
        min: 3
        max: 253
        default: "idm.prod.spg"

      - question_name: "IdM IP Address"
        question_description: "IPv4 address of the IdM node"
        required: true
        type: text
        variable: idm_ip
        min: 7
        max: 15
        default: "10.168.128.3"

      - question_name: "IdM Admin Password"
        question_description: "Admin (ipaadmin) password for the IdM server"
        required: true
        type: password
        variable: ipaadmin_password
        min: 8
        max: 128
        default: ""

      - question_name: "IdM Directory Services Password"
        question_description: "Directory Manager (DS) password for IdM"
        required: true
        type: password
        variable: ipadm_password
        min: 8
        max: 128
        default: ""

      # ----- Global Admin ---------------------------------------------------
      - question_name: "Global Admin Username"
        question_description: "Common administrative username across all RHIS nodes"
        required: true
        type: text
        variable: admin_user
        min: 1
        max: 64
        default: "admin"

      - question_name: "Global Admin Password"
        question_description: "Shared admin password for all RHIS-managed services"
        required: true
        type: password
        variable: global_admin_password
        min: 8
        max: 128
        default: ""

      # ----- Red Hat Credentials --------------------------------------------
      - question_name: "Red Hat Username"
        question_description: "customer.portal.redhat.com account username (email)"
        required: true
        type: text
        variable: rh_user
        min: 3
        max: 256
        default: ""

      - question_name: "Red Hat Password"
        question_description: "customer.portal.redhat.com account password"
        required: true
        type: password
        variable: rh_pass
        min: 1
        max: 256
        default: ""

      - question_name: "Red Hat Offline Token"
        question_description: "Offline token from console.redhat.com for API access
          (rh_offline_token)"
        required: false
        type: textarea
        variable: rh_offline_token
        min: 0
        max: 4096
        default: ""

      - question_name: "Automation Hub Token"
        question_description: "console.redhat.com Automation Hub offline token for
          collection downloads"
        required: false
        type: textarea
        variable: hub_token
        min: 0
        max: 4096
        default: ""

      # ----- CDN / Subscription ---------------------------------------------
      - question_name: "CDN Organization ID"
        question_description: "Red Hat subscription organization ID (numeric)"
        required: true
        type: text
        variable: cdn_organization_id
        min: 1
        max: 32
        default: ""

      - question_name: "CDN / Satellite Activation Key"
        question_description: "Satellite activation key for node registration
          (cdn_sat_activation_key)"
        required: true
        type: text
        variable: cdn_sat_activation_key
        min: 1
        max: 128
        default: ""

      # ----- Network --------------------------------------------------------
      - question_name: "Internal Network CIDR Base"
        question_description: "Base IP of the internal provisioning network (e.g. 10.168.0.0)"
        required: false
        type: text
        variable: internal_network
        min: 7
        max: 15
        default: "10.168.0.0"

      - question_name: "Provisioning Network Mask"
        question_description: "Subnet mask for the provisioning network"
        required: false
        type: text
        variable: netmask
        min: 7
        max: 15
        default: "255.255.0.0"

      # ----- Platform Target ------------------------------------------------
      - question_name: "Deployment Platform"
        question_description: "Target hypervisor or cloud platform for new VM provisioning"
        required: true
        type: multiplechoice
        variable: minirhis_target_platform
        choices: "libvirt

          vmware

          nutanix

          aws

          azure

          gcp

          baremetal"
        default: "libvirt"

# ─── Customer / Per-Project Environment Onboarding ───────────────────────────
# Operator-facing workflow that creates a fully isolated credential set in AAP
# for each new customer or project environment.
#
# Flow:
#   1. Operator launches "RHIS | Customer | Onboard New Environment" workflow.
#   2. Survey collects: customer name, environment tag, RH subscription, node
#      topology, admin credentials.
#   3. "Create Environment File" template writes a vault-encrypted
#      <CUSTOMER>-<ENV>.yml to aap_config_customer_env_dir on platform_installer.
#   4. "Provision Credentials" template loads that file and creates
#      <CUSTOMER>-<ENV> * credentials in AAP.
#
# The resulting credentials are NEVER the same objects as the RHIS infra
# credentials (RHIS *) — they cannot be used to manage MiniRHIS itself.

# Directory on platform_installer where customer env vault files are stored.
aap_config_customer_env_dir: "{{ ansible_env.HOME }}/.ansible/conf/customers"

# Runtime vars — always provided via extra_vars or survey output at runtime.
# Left empty in defaults.
aap_customer_name: "" # e.g. "ACME"  — alphanumeric, no spaces
aap_customer_env: "" # e.g. "PROD", "DEV", "UAT", "LAB"

# When true, create a dedicated AAP Organization named after the customer.
# When false (default), credentials land in aap_config_organization.
aap_customer_create_org: false

# ─── Customer Onboarding Workflow ────────────────────────────────────────────
aap_config_customer_onboarding_workflow:
  name: "RHIS | Customer | Onboard New Environment"
  description: >-
    Interview-driven workflow for onboarding a new customer or project
    environment.  Collects the customer's own Red Hat subscription, node
    topology, and admin credentials via survey — completely separate from the
    MiniRHIS operator's credentials.  Creates a vaulted <CUSTOMER>-<ENV>.yml
    file and a matching credential set in AAP (<CUSTOMER>-<ENV> Machine, Vault,
    CDN, Hub, Registry, Env Variables).
  organization: "{{ aap_config_organization }}"
  inventory: "RHIS Builder Inventory"
  ask_variables_on_launch: false
  survey_enabled: true
  state: present
  survey_spec:
    name: "RHIS Customer Environment Onboarding Survey"
    description: >-
      Provide the customer/project name, environment tag, and all connection
      details for the new deployment target.  A vaulted env file and isolated
      AAP credential set will be created automatically.  The MiniRHIS
      infrastructure credentials are NOT affected.
    spec:
      # ----- Customer identity -----------------------------------------------
      - question_name: "Customer / Project Name"
        question_description: >-
          Short identifier for the customer or project.  Letters and numbers
          only — no spaces.  Used as the credential prefix in AAP. Examples:
          ACME, CLIENTCORP, PROJECT1, RHISDEMO
        required: true
        type: text
        variable: aap_customer_name
        min: 1
        max: 32
        default: ""

      - question_name: "Environment Tag"
        question_description: >-
          Short tag that identifies this environment instance.  Combined with
          the customer name to namespace all credentials, e.g. ACME-PROD.
        required: true
        type: multiplechoice
        variable: aap_customer_env
        choices: "PROD

          DEV

          STAGING

          UAT

          LAB

          DEMO

          SANDBOX"
        default: "PROD"

      # ----- Red Hat subscription --------------------------------------------
      - question_name: "Customer Red Hat Username"
        question_description: >-
          Red Hat account (email) for this customer's own subscription. This is
          NOT the MiniRHIS operator's account.
        required: true
        type: text
        variable: customer_rh_user
        min: 3
        max: 256
        default: ""

      - question_name: "Customer Red Hat Password"
        required: true
        type: password
        variable: customer_rh_pass
        min: 1
        max: 256
        default: ""

      - question_name: "Customer Red Hat Offline Token"
        question_description: >-
          Offline token from console.redhat.com for API / Automation Hub access.
        required: false
        type: textarea
        variable: customer_rh_offline_token
        min: 0
        max: 4096
        default: ""

      - question_name: "Customer Automation Hub Token"
        question_description: >-
          console.redhat.com Automation Hub offline token for collection
          downloads in this customer's environment.
        required: false
        type: textarea
        variable: customer_hub_token
        min: 0
        max: 4096
        default: ""

      - question_name: "Customer CDN Organization ID"
        question_description: "Red Hat subscription organization ID (numeric)"
        required: true
        type: text
        variable: customer_cdn_organization_id
        min: 1
        max: 32
        default: ""

      - question_name: "Customer CDN / Satellite Activation Key"
        question_description: >-
          Satellite activation key for registering this customer's nodes.
        required: true
        type: text
        variable: customer_cdn_sat_activation_key
        min: 1
        max: 128
        default: ""

      # ----- Admin credentials -----------------------------------------------
      - question_name: "Customer Admin Username"
        question_description: >-
          Common admin username across all nodes in this customer's environment.
        required: true
        type: text
        variable: customer_admin_user
        min: 1
        max: 64
        default: "admin"

      - question_name: "Customer Admin Password"
        question_description: >-
          Shared admin password for all customer-managed services (Satellite,
          AAP, IdM).
        required: true
        type: password
        variable: customer_admin_pass
        min: 8
        max: 128
        default: ""

      - question_name: "Customer IdM Admin Password"
        question_description: >-
          ipa-admin password for this customer's IdM server. Defaults to the
          admin password if left blank.
        required: false
        type: password
        variable: customer_ipaadmin_password
        min: 0
        max: 128
        default: ""

      - question_name: "Customer SSH Private Key"
        question_description: >-
          PEM-encoded SSH private key for passwordless node access. Leave blank
          to use password authentication only.
        required: false
        type: textarea
        variable: customer_ssh_key
        min: 0
        max: 8192
        default: ""

      # ----- Environment topology --------------------------------------------
      - question_name: "Customer Domain"
        question_description: >-
          DNS domain for this customer's environment (e.g. acme-prod.example.com)
        required: true
        type: text
        variable: customer_domain
        min: 3
        max: 253
        default: ""

      - question_name: "Customer Kerberos Realm"
        question_description: "Kerberos / IdM realm — must be uppercase"
        required: true
        type: text
        variable: customer_realm
        min: 3
        max: 253
        default: ""

      - question_name: "Customer Satellite Organization"
        required: true
        type: text
        variable: customer_sat_org
        min: 1
        max: 128
        default: ""

      - question_name: "Customer Satellite Location"
        required: true
        type: text
        variable: customer_sat_loc
        min: 1
        max: 128
        default: "HQ"

      - question_name: "Customer Satellite Hostname (FQDN)"
        required: true
        type: text
        variable: customer_sat_hostname
        min: 3
        max: 253
        default: ""

      - question_name: "Customer Satellite IP Address"
        required: true
        type: text
        variable: customer_sat_ip
        min: 7
        max: 15
        default: ""

      - question_name: "Customer AAP Hostname (FQDN)"
        required: true
        type: text
        variable: customer_aap_hostname
        min: 3
        max: 253
        default: ""

      - question_name: "Customer AAP IP Address"
        required: true
        type: text
        variable: customer_aap_ip
        min: 7
        max: 15
        default: ""

      - question_name: "Customer IdM Hostname (FQDN)"
        required: true
        type: text
        variable: customer_idm_hostname
        min: 3
        max: 253
        default: ""

      - question_name: "Customer IdM IP Address"
        required: true
        type: text
        variable: customer_idm_ip
        min: 7
        max: 15
        default: ""

      # ----- Vault / security ------------------------------------------------
      - question_name: "Customer Environment Vault Password"
        question_description: >-
          Password used to encrypt the <CUSTOMER>-<ENV>.yml file. Leave blank to
          use the MiniRHIS operator vault password. Providing a dedicated
          password here gives the customer their own vault — the MiniRHIS
          operator cannot decrypt it without this password.
        required: false
        type: password
        variable: customer_vault_password
        min: 0
        max: 128
        default: ""

      - question_name: "Create Dedicated AAP Organization?"
        question_description: >-
          'true' creates a separate AAP org for this customer so all credentials
          are scoped to them.  'false' (default) places credentials in the
          MiniRHIS default organization.
        required: true
        type: multiplechoice
        variable: aap_customer_create_org
        choices: "false\ntrue"
        default: "false"
