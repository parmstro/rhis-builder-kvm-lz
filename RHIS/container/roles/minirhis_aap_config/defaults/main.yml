# ─── Job Templates ───────────────────────────────────────────────────────────
# Standard template per deployable project.  Templates that have no runnable
# playbook (docs-only repos) are limited to check mode.  The survey workflow
# is the recommended entry point for new environment deployments.
aap_config_templates:
  - name: "RHIS | Build | rhis-builder"
    description: "Run the core rhis-builder provisioner against the RHIS Builder Inventory"
    project: "rhis-builder"
    playbook: "main.yml"
    inventory: "RHIS Builder Inventory"
    credentials:
      - "RHIS Machine Credential"
      - "RHIS Vault Credential"
      - "RHIS Red Hat CDN"
      - "RHIS Environment Variables"
    execution_environment: "{{ aap_config_ee_name }}"
    ask_variables_on_launch: true
    survey_enabled: false
    organization: "{{ aap_config_organization }}"
    state: present

  - name: "RHIS | Build | rhis-builder-satellite"
    description: "Deploy and configure Satellite for RHIS"
    project: "rhis-builder-satellite"
    playbook: "main.yml"
    inventory: "RHIS Builder Inventory"
    credentials:
      - "RHIS Machine Credential"
      - "RHIS Vault Credential"
      - "RHIS Red Hat CDN"
      - "RHIS Environment Variables"
    execution_environment: "{{ aap_config_ee_name }}"
