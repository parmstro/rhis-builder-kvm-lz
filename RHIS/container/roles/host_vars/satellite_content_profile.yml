---
# satellite_content_profile.yml — persistent Satellite content/provisioning profile
#
# This file is intentionally separate from generated host_vars/satellite.yml so
# run_rhis_install_sequence.sh does not overwrite it. It is loaded through the
# playbook vars_dir include flow when /rhis/vars/host_vars is mounted.
#
# Authentication model:
#   All API connections use satellite_username ("admin") and satellite_password
#   resolved from vault: sat_admin_pass → global_admin_password.
#   The foreman_* and hammer_* aliases are defined in satellite.yml (host_vars)
#   via the module_defaults group block — no need to duplicate them here.
#
# Notes:
# - DNS/DHCP/TFTP/Libvirt provisioning features are already enabled by the
#   Satellite installer command in rhis_install.sh.
# - This file focuses on post-install content organization: lifecycle envs,
#   content views, activation keys, and a declarative repo model for RHEL 9/10.

satellite_username: "{{ admin_user | default('admin') }}"
satellite_password: "bj8H7ndC7$"

satellite_organization: "REDHAT"
satellite_location: "CORE"

# Requested lifecycle environments
lifecycle_environments:
  - name: "DEV_RHEL_10_x86_64"
    label: "DEV_RHEL_10_x86_64"
    organization: "{{ satellite_organization }}"
    prior: "Library"
  - name: "TEST_RHEL_10_x86_64"
    label: "TEST_RHEL_10_x86_64"
    organization: "{{ satellite_organization }}"
    prior: "DEV_RHEL_10_x86_64"
  - name: "PROD_RHEL_10_x86_64"
    label: "PROD_RHEL_10_x86_64"
    organization: "{{ satellite_organization }}"
    prior: "TEST_RHEL_10_x86_64"
  - name: "DEV_RHEL_9_x86_64"
    label: "DEV_RHEL_9_x86_64"
    organization: "{{ satellite_organization }}"
    prior: "Library"
  - name: "TEST_RHEL_9_x86_64"
    label: "TEST_RHEL_9_x86_64"
    organization: "{{ satellite_organization }}"
    prior: "DEV_RHEL_9_x86_64"
  - name: "PROD_RHEL_9_x86_64"
    label: "PROD_RHEL_9_x86_64"
    organization: "{{ satellite_organization }}"
    prior: "TEST_RHEL_9_x86_64"

# Requested Content Views
content_views:
  - name: "rhel-10-for-x86_64"
    organization: "{{ satellite_organization }}"
    repositories:
      - name: "rhel-10-for-x86_64-baseos-rpms"
      - name: "rhel-10-for-x86_64-appstream-rpms"
  - name: "rhel-9-for-x86_64"
    organization: "{{ satellite_organization }}"
    repositories:
      - name: "rhel-9-for-x86_64-baseos-rpms"
      - name: "rhel-9-for-x86_64-appstream-rpms"

# Requested activation keys
activation_keys:
  - name: "DEV_RHEL_10_x86_64"
    organization: "{{ satellite_organization }}"
    lifecycle_environment: "DEV_RHEL_10_x86_64"
    content_view: "rhel-10-for-x86_64"
  - name: "TEST_RHEL_10_x86_64"
    organization: "{{ satellite_organization }}"
    lifecycle_environment: "TEST_RHEL_10_x86_64"
    content_view: "rhel-10-for-x86_64"
  - name: "PROD_RHEL_10_x86_64"
    organization: "{{ satellite_organization }}"
    lifecycle_environment: "PROD_RHEL_10_x86_64"
    content_view: "rhel-10-for-x86_64"
  - name: "DEV_RHEL_9_x86_64"
    organization: "{{ satellite_organization }}"
    lifecycle_environment: "DEV_RHEL_9_x86_64"
    content_view: "rhel-9-for-x86_64"
  - name: "TEST_RHEL_9_x86_64"
    organization: "{{ satellite_organization }}"
    lifecycle_environment: "TEST_RHEL_9_x86_64"
    content_view: "rhel-9-for-x86_64"
  - name: "PROD_RHEL_9_x86_64"
    organization: "{{ satellite_organization }}"
    lifecycle_environment: "PROD_RHEL_9_x86_64"
    content_view: "rhel-9-for-x86_64"

# Declarative repository intent for RHEL 9/10 content views.
# These IDs align with the repository labels you requested.
satellite_desired_rhel_content:
  rhel_10_x86_64:
    content_view: "rhel-10-for-x86_64"
    repositories:
      - "rhel-10-for-x86_64-baseos-rpms"
      - "rhel-10-for-x86_64-appstream-rpms"
  rhel_9_x86_64:
    content_view: "rhel-9-for-x86_64"
    repositories:
      - "rhel-9-for-x86_64-baseos-rpms"
      - "rhel-9-for-x86_64-appstream-rpms"

# Provisioning intent notes: these are already enabled in the Satellite install
# command generated by rhis_install.sh:
# - DHCP
# - DNS
# - TFTP
# - Libvirt compute integration
# - Kickstart/image-based provisioning support through Satellite media/compute roles

# ---------------------------------------------------------------------------
# Satellite settings
# Keys are the internal API names (same as `hammer settings set --name <key>`)
# ---------------------------------------------------------------------------
settings_general:
  - name: "unregister_delete_host"
    value: "true"
  - name: "default_download_policy"
    value: "on_demand"
  - name: "content_view_solve_dependencies"
    value: "true"
  - name: "query_local_nameservers"
    value: "true"
  - name: "login_text"
    value: "AUTHORIZED USE ONLY. Access to this system is monitored and logged."

settings_remote_execution:
  - name: "remote_execution_ssh_user"
    value: "root"
  - name: "remote_execution_by_default"
    value: "true"
  - name: "ansible_ssh_private_key_file"
    value: "/root/.ssh/id_rsa"

settings_rhcloud:
  - name: "insights_sync"
    value: "true"
  - name: "rh_cloud_token"
    value: "" # populated during insights_satellite step via rhc
  - name: "destroy_vm_on_host_delete"
    value: "false"

# Red Hat Insights + RHC client settings (applied to the Satellite host itself)
# These drive the insights_satellite and insights_nodes hammer_time steps:
#   register_insights_satellite: register the Satellite host to Insights via rhc
#   insights_packages:           packages installed on the Satellite host
#   node_insights_packages:      packages pushed to provisioned nodes via rex
satellite_insights:
  register_satellite: true
  insights_packages:
    - insights-client
    - rhc
    - rhc-worker-playbook
  node_packages:
    - insights-client
    - rhc
    - rhc-worker-playbook

# ---------------------------------------------------------------------------
# DNS domain
# dns_capsule: hostname of the Satellite server managing DNS for this domain
# ---------------------------------------------------------------------------
satellite_domains:
  - name: "prod.spg"
    description: "RHIS production domain"
    organizations:
      - "REDHAT"
    locations:
      - "CORE"
    dns_capsule: "satellite.prod.spg"
    state: present

# ---------------------------------------------------------------------------
# Satellite users
# user_password uses the vault variable — no plaintext passwords stored here
# Field names match ensure_user.yml: email, time_zone, user_password, admin
# ---------------------------------------------------------------------------
satellite_users:
  - name: "admin"
    firstname: "Admin"
    lastname: "User"
    email: "admin@prod.spg"
    admin: true
    user_password: "{{ sat_admin_pass | default(global_admin_password) | default('') }}"
    auth_source: "Internal"
    time_zone: "Mountain Time (US & Canada)"
    organization_on_login: "REDHAT"
    location_on_login: "CORE"
    state: present

# ---------------------------------------------------------------------------
# Host groups
# activation_keys: list of activation key names to assign to the group
# ---------------------------------------------------------------------------
satellite_hostgroups:
  - name: "RHEL9"
    description: "RHEL 9 production hosts"
    organization: "REDHAT"
    organizations:
      - "REDHAT"
    locations:
      - "CORE"
    lifecycle_environment: "PROD_RHEL_9_x86_64"
    content_view: "rhel-9-for-x86_64"
    activation_keys:
      - "PROD_RHEL_9_x86_64"
    state: present
  - name: "RHEL10"
    description: "RHEL 10 production hosts"
    organization: "REDHAT"
    organizations:
      - "REDHAT"
    locations:
      - "CORE"
    lifecycle_environment: "PROD_RHEL_10_x86_64"
    content_view: "rhel-10-for-x86_64"
    activation_keys:
      - "PROD_RHEL_10_x86_64"
    state: present
  - name: "Satellite"
    description: "Satellite capsule and node hosts"
    organization: "REDHAT"
    organizations:
      - "REDHAT"
    locations:
      - "CORE"
    lifecycle_environment: "Library"
    content_view: "satellite-6.18-node"
    activation_keys:
      - "SATELLITE_NODE_RHEL_9"
    state: present

# ---------------------------------------------------------------------------
# Global parameters (applied to all managed hosts)
# host_registration_insights and host_registration_remote_execution control
# whether the Satellite-generated registration command enables Insights and
# remote execution for every newly provisioned node.
# ---------------------------------------------------------------------------
global_parameters:
  - name: "rhis_org"
    value: "REDHAT"
    parameter_type: "string"
    state: present
  - name: "rhis_location"
    value: "CORE"
    parameter_type: "string"
    state: present
  - name: "host_registration_insights"
    value: "true"
    parameter_type: "boolean"
    state: present
  - name: "host_registration_remote_execution"
    value: "true"
    parameter_type: "boolean"
    state: present
  - name: "remote_execution_pull_proxy_url"
    value: ""
    parameter_type: "string"
    state: present
