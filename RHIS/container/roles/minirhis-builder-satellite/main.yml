---
# Compatibility playbook for local Satellite config runs.
# The previous builder path is referenced by MiniRHIS retry/healthcheck flows.
- name: "Configure Satellite (compatibility entrypoint)"
  hosts: scenario_satellite
  become: true
  gather_facts: true

  tasks:
    - name: "Load the vault variables"
      when: vault_path is defined
      ansible.builtin.include_vars:
        file: "{{ vault_path }}"
      tags:
        - always

    - name: "Load the other variables"
      when: vars_path is defined
      ansible.builtin.include_vars:
        file: "{{ vars_path }}"
      tags:
        - always

    - name: "Load the vault variables"
      when: vault_dir is defined
      ansible.builtin.include_vars:
        dir: "{{ vault_dir }}"
      tags:
        - always

    - name: "Load the other variables"
      when: vars_dir is defined
      ansible.builtin.include_vars:
        dir: "{{ vars_dir }}"
      tags:
        - always

    - name: "Load sat config defaults"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../minirhis_sat_config/defaults/main.yml"
      tags:
        - always

    - name: "Run sat config tasks"
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../minirhis_sat_config/tasks/main.yml"
      tags:
        - tags_sat_config
