---
# rhis_vm_lifecycle/tasks/set_passwords.yml
# Sets the root password on each running RHIS VM via qemu-guest-agent
# (virsh set-user-password).  The VM must have qemu-guest-agent running.

- name: Ensure root password variable is set
  ansible.builtin.assert:
    that:
      - rhis_vm_root_password | length > 0
    fail_msg: >
      rhis_vm_root_password is empty. Pass it via --extra-vars admin_pass=<value>
      or ensure admin_pass is in the vault.

- name: Set root password on each VM via virsh guest agent
  ansible.builtin.command: >
    virsh set-user-password {{ item }} root {{ rhis_vm_root_password }}
  loop: "{{ rhis_vms }}"
  register: pw_result
  failed_when:
    - pw_result.rc is defined
    - pw_result.rc != 0
  changed_when: pw_result.rc == 0
  become: true
  no_log: true

- name: Report password update results
  ansible.builtin.debug:
    msg: >
      {{ item.item }}: {{ 'updated' if item.rc == 0 else 'FAILED — guest agent may not be ready' }}
  loop: "{{ pw_result.results }}"
