---
# tasks/configure_repository_sets.yml — rhis_sat_config
# Enable repository sets for RHEL 9/10, Satellite client, HA, and AAP 2.6.

- name: "Enable repository sets for each RHEL major"
  ansible.builtin.include_tasks:
    file: enable_repo_set_item.yml
  loop: "{{ rhis_sat_config_repo_sets | product(rhis_sat_config_rhel_majors) |
    list }}"
  loop_control:
    label: "{{ item.0.product }} / {{ item.1 }}"
  tags:
    - tags_sat_config_repos
