---
# tasks/configure_settings.yml — rhis_sat_config
# Applies global Satellite settings (Insights upload, HTTP proxy, etc.)

- name: "Apply Satellite API defaults"
  module_defaults:
    group/redhat.satellite.satellite:
      username: "{{ satellite_username }}"
      password: "{{ satellite_password }}"
      server_url: "{{ satellite_url }}"
      validate_certs: "{{ satellite_validate_certs }}"
  block:
    - name: "Configure Satellite setting"
      redhat.satellite.setting:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
      loop: "{{ rhis_sat_config_settings }}"
      failed_when: false
      register: rhis_sat_config_settings_result
      tags:
        - tags_sat_config_settings

    - name: "Warn for Satellite settings that could not be applied"
      ansible.builtin.debug:
        msg: "Satellite setting '{{ item.item.name }}' failed: {{ item.msg |
          default(item) }}"
      loop: "{{ rhis_sat_config_settings_result.results | default([]) }}"
      when: item.failed | default(false)
      changed_when: false
      tags:
        - tags_sat_config_settings
