---
# tasks/sync_repos.yml — rhis_sat_config
# Triggers a full product sync for all products in the organization.

- name: "Trigger immediate sync of all products via hammer"
  tags:
    - tags_sat_config_sync
  block:
    - name: "List products in organization via API"
      module_defaults:
        group/redhat.satellite.satellite:
          username: "{{ satellite_username }}"
          password: "{{ satellite_password }}"
          server_url: "{{ satellite_url }}"
          validate_certs: "{{ satellite_validate_certs }}"
      block:
        - name: "Fetch product list from Satellite"
          redhat.satellite.resource_info:
            organization: "{{ satellite_organization }}"
            resource: products
          register: _products

    - name: "Trigger product synchronize via API for each product"
      ansible.builtin.uri:
        url: "{{ satellite_url }}/api/v2/products/{{ item.id }}/synchronize"
        method: POST
        user: "{{ satellite_username | default(omit) }}"
        password: "{{ satellite_password | default(omit) }}"
        force_basic_auth: true
        validate_certs: "{{ satellite_validate_certs | default(false) }}"
        status_code:
          - 200
          - 201
          - 202
      loop: "{{ _products.resources | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      register: _sync_results
  rescue:
    - name: "Fallback: Trigger immediate sync of all products via hammer"
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir
          }}/container/roles/rhis_tools/tasks/hammer_api_fallback.yml"
      vars:
        api_path: "products"
        search_expr: ""
        hammer_cmd: >-
          hammer product synchronize --organization "{{ satellite_organization
          }}" --async

    - name: "Map fallback result to _sync"
      ansible.builtin.set_fact:
        _sync: "{{ fallback_result }}"
      changed_when: false

- name: "Show sync task result"
  ansible.builtin.debug:
    msg: >-
      {{ (_sync.stdout_lines | default([]))
         if (_sync is defined)
         else (_sync_results | default({})) }}
  tags:
    - tags_sat_config_sync
