---
# provision_customer_credentials.yml
#
# Runs on platform_installer.  Reads the vault-encrypted
# <CUSTOMER>-<ENV>.yml file and creates a fully isolated, namespaced
# credential set in the AAP Controller.
#
# Run this after 'RHIS | Customer | Create Environment File' has completed.
#
# Required extra_vars:
#   aap_customer_name   — e.g. "ACME"
#   aap_customer_env    — e.g. "PROD"
#
# Optional extra_vars:
#   aap_customer_create_org         — true to create a per-customer AAP org
#   aap_config_customer_env_dir     — override customer env directory
#   aap_config_vault_pass_path      — override vault password file path
#   aap_config_platform_host        — override AAP controller URL
#   aap_config_username             — override AAP admin username
#   aap_config_password             — override AAP admin password
#   aap_config_validate_certs       — override TLS validation (default: false)
#   aap_config_organization         — override default AAP organization

- name: "Provision customer AAP credentials from vault file"
  hosts: "platform_installer"
  become: false

  vars:
    _customer_env_dir: >-
      {{ aap_config_customer_env_dir
         | default(ansible_env.HOME + '/.ansible/conf/customers') }}
    _vault_pass_path: >-
      {{ aap_config_vault_pass_path
         | default(ansible_env.HOME + '/.ansible/conf/.vaultpass.txt') }}

  tasks:
    - name: "Validate required inputs"
      ansible.builtin.assert:
        that:
          - aap_customer_name | default('') | length > 0
          - aap_customer_env | default('') | length > 0
        fail_msg: >-
          Both aap_customer_name and aap_customer_env must be provided.

    - name: "Derive customer environment file path"
      ansible.builtin.set_fact:
        _cust_id: "{{ (aap_customer_name | upper) + '-' + (aap_customer_env | upper) }}"
        _cust_file: >-
          {{ _customer_env_dir + '/'
             + (aap_customer_name | upper) + '-'
             + (aap_customer_env | upper) + '.yml' }}

    - name: "Assert customer environment file exists"
      ansible.builtin.stat:
        path: "{{ _cust_file }}"
      register: _env_stat

    - name: "Fail when customer env file is missing"
      ansible.builtin.fail:
        msg: >-
          Customer environment file not found: {{ _cust_file }} Run 'RHIS |
          Customer | Create Environment File' first with aap_customer_name={{
          aap_customer_name }} aap_customer_env={{ aap_customer_env }}.
      when: not _env_stat.stat.exists

    - name: "Load customer environment variables (vault-decrypted)"
      ansible.builtin.include_vars:
        file: "{{ _cust_file }}"

    - name: "Resolve AAP Controller connection facts"
      ansible.builtin.set_fact:
        aap_config_platform_host: >-
          {{ aap_config_platform_host
             | default('https://' + (ansible_host | default(inventory_hostname))) }}
        aap_config_username: >-
          {{ aap_config_username
             | default(aap_platform_username
             | default(aap_admin_user
             | default(admin_user | default('admin')))) }}
        aap_config_password: >-
          {{ aap_config_password
             | default(aap_platform_password
             | default(aap_admin_password
             | default(global_admin_password | default('')))) }}
        aap_config_validate_certs: "{{ aap_config_validate_certs | default(false) | bool }}"
        aap_config_organization: "{{ aap_config_organization | default('Default') }}"
        aap_config_vault_pass_path: "{{ _vault_pass_path }}"
      changed_when: false

    - name: "Create {{ _cust_id }} credential set in AAP"
      ansible.builtin.include_role:
        name: minirhis_aap_config
        tasks_from: create_customer_credentials.yml

    - name: "Report completion"
      ansible.builtin.debug:
        msg: >-
          Credential set provisioned for {{ _cust_id }}. The following
          credentials are now available in AAP (organization: {{
          aap_config_organization }}):
            - {{ _cust_id }} Machine Credential
            - {{ _cust_id }} Vault Credential
            - {{ _cust_id }} Red Hat CDN
            - {{ _cust_id }} Automation Hub Token
            - {{ _cust_id }} Red Hat Registry
            - {{ _cust_id }} Environment Variables
          Use these credentials in job templates targeting {{ _cust_id }}
          environments.  They are isolated from MiniRHIS infrastructure
          credentials and cannot be used to manage MiniRHIS components.
