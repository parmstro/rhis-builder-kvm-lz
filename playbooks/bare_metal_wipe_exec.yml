---
- name: Boot Server to Live ISO and Execute Disk Wipe
  hosts: infra_servers
  connection: local
  gather_facts: false

  tasks:
    # =====================================================================
    # --- SAFETY PRE-FLIGHT CHECK ---
    # =====================================================================

    - name: Display wipe operation warning
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "WARNING: DESTRUCTIVE DISK WIPE OPERATION"
          - "=============================================="
          - "Host: {{ inventory_hostname }} ({{ ansible_host }})"
          - "This operation will PERMANENTLY ERASE disks"
          - "Execution of this playbook is confirmation"
          - "=============================================="

    # =====================================================================
    # --- BOOT OVERRIDE CONFIGURATION ---
    # =====================================================================

    - name: Configure First Boot Device to Virtual CD (Boot Once)
      dellemc.openmanage.idrac_boot:
        idrac_ip: "{{ idrac_ip }}"
        idrac_user: "{{ idrac_user }}"
        idrac_password: "{{ idrac_password }}"
        validate_certs: false
        boot_source_override_mode: "uefi"
        boot_source_override_target: "cd"
        boot_source_override_enabled: "once"
      delegate_to: localhost

    # =====================================================================
    # --- POWER STATE MANAGEMENT ---
    # =====================================================================

    - name: Attempt graceful restart via iDRAC
      dellemc.openmanage.redfish_powerstate:
        baseuri: "{{ idrac_ip }}"
        username: "{{ idrac_user }}"
        password: "{{ idrac_password }}"
        validate_certs: false
        reset_type: "GracefulRestart"
      delegate_to: localhost
      register: restart_result
      ignore_errors: true

    - name: Power on device if already powered off
      dellemc.openmanage.redfish_powerstate:
        baseuri: "{{ idrac_ip }}"
        username: "{{ idrac_user }}"
        password: "{{ idrac_password }}"
        validate_certs: false
        reset_type: "On"
      delegate_to: localhost
      when: "'already powered off' in restart_result.msg | lower"

    # =====================================================================
    # --- LIVE ISO REACHABILITY MONITOR ---
    # =====================================================================

    - name: Wait for Live ISO to boot and become reachable via SSH
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 22
        state: started
        delay: 60    # Wait 1 minute for Live ISO boot
        timeout: 600  # 10 minute timeout for Live ISO boot
      delegate_to: localhost

- name: Execute Disk Wipe Operations
  hosts: infra_servers
  gather_facts: true
  vars:
    # Override connection settings for Live ISO
    ansible_user: "{{ ansible_user_liveiso }}"
    ansible_ssh_pass: "{{ ansible_ssh_pass_liveiso }}"

  tasks:
    - name: Record wipe timestamp for log retrieval
      ansible.builtin.set_fact:
        wipe_timestamp: "{{ ansible_date_time.epoch }}"

    # Capture intended post-action before overriding for the role.
    # The role is run with post_action: none so the wrapper can fetch logs
    # before powering off or rebooting.
    - name: Capture intended post-wipe action
      ansible.builtin.set_fact:
        __wrapper_post_action: "{{ kvm_wipe_disk_post_action }}"

    - name: Override role post-action to defer power control to wrapper
      ansible.builtin.set_fact:
        kvm_wipe_disk_post_action: "none"

    # =====================================================================
    # --- DISK DETECTION AND WIPE ---
    # =====================================================================

    - name: Detect and wipe disks via collection role
      ansible.builtin.import_role:
        name: elise.rhis_builder_kvm_lz.kvm_wipe_disk

    # =====================================================================
    # --- LOG RETRIEVAL ---
    # =====================================================================

    - name: Find wipe log files on remote host
      ansible.builtin.find:
        paths: "{{ kvm_wipe_disk_log_path }}"
        patterns: "wipe_*.log"
      register: wipe_log_files

    - name: Ensure local logs directory exists
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../logs"
        state: directory
        mode: "0755"
      delegate_to: localhost

    - name: Fetch wipe logs to controller
      ansible.builtin.fetch:
        src: "{{ item.path }}"
        dest: "logs/wipe_{{ inventory_hostname }}_{{ wipe_timestamp }}_{{ item.path | basename }}"
        flat: true
      loop: "{{ wipe_log_files.files }}"

    # =====================================================================
    # --- POST-WIPE ACTION ---
    # =====================================================================

    - name: Power off system after wipe
      community.general.shutdown:
        msg: "kvm_wipe_disk: wipe complete, powering off"
        delay: 0
      when: __wrapper_post_action == "poweroff"
      become: true

    - name: Reboot system after wipe
      ansible.builtin.reboot:
        post_reboot_delay: 15
        reboot_timeout: 600
      when: __wrapper_post_action == "reboot"
      become: true

    - name: Leave system running after wipe
      ansible.builtin.debug:
        msg: "Wipe complete. System left running in Live ISO for manual verification."
      when: __wrapper_post_action == "none"
...
