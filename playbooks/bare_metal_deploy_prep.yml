---
- name: Prepare Virtual Media for Kickstart Installation
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../vars/vm_vars.yml

  tasks:
    # =====================================================================
    # --- LOCAL WORKSPACE SETUP ---
    # =====================================================================

    - name: Ensure required image manipulation packages are installed locally
      ansible.builtin.package:
        name:
          - dosfstools
          - mtools
        state: present
      become: true

    - name: Ensure local workspace directory exists
      ansible.builtin.file:
        path: "{{ local_workspace }}"
        state: directory
        mode: '0755'

    # =====================================================================
    # --- PER-HOST KICKSTART AND IMAGE GENERATION via group_vars loop ---
    # =====================================================================

    - name: Kickstart and image gen per host subtasks
      ansible.builtin.include_tasks: "../tasks/bare_metal_deploy_prep_subtasks1.yml"
      loop: "{{ groups['infra_servers'] }}"

- name: Prepare Virtual Media http_server for Kickstart Installation
  hosts: http_servers
  gather_facts: false

  tasks:
    # =====================================================================
    # --- REMOTE HTTP SERVER SETUP ---
    # =====================================================================

    - name: Ensure target HTTP document root exists
      ansible.builtin.file:
        path: "{{ remote_http_docroot }}"
        state: directory
        mode: '0755'
      become: true

    - name: Ensure target HTTP subdirectories exist
      ansible.builtin.file:
        path: "{{ remote_http_docroot }}/{{ item.relative_path }}"
        state: "{{ item.state }}"
        mode: "{{ item.mode }}"
      become: true
      loop:
        - { relative_path: 'iso', state: 'directory', mode: '0755' }
        - { relative_path: 'image', state: 'directory', mode: '0755' }

    - name: Ensure per-host image directory exists
      ansible.builtin.file:
        path: "{{ remote_http_docroot }}/image/{{ hostvars[item].host.hostname }}"
        state: directory
        mode: '0755'
      become: true
      loop: "{{ groups['infra_servers'] }}"

    # =====================================================================
    # --- TRANSFER FILES TO REMOTE HTTP SERVER ---
    # =====================================================================

    - name: Copy local ISO to remote HTTP server iso subdirectory
      ansible.posix.synchronize:
        src: "{{ local_iso_path }}/{{ iso_filename }}"
        dest: "{{ remote_http_user }}@{{ remote_http_host }}:{{ remote_http_docroot }}/iso/{{ iso_filename }}"
        rsync_opts:
          - "--chmod=0644"
      become: true

    - name: Copy local ISO to /dev/shm on remote HTTP server for tmpfs performance
      ansible.posix.synchronize:
        src: "{{ local_iso_path }}/{{ iso_filename }}"
        dest: "{{ remote_http_user }}@{{ remote_http_host }}:/dev/shm/{{ iso_filename }}"
        rsync_opts:
          - "--chmod=0644"
      become: true
      when: iso_use_tmpfs | bool

    - name: Create symlink from HTTP docroot to ISO in /dev/shm
      ansible.builtin.file:
        src: "/dev/shm/{{ iso_filename }}"
        dest: "{{ remote_http_docroot }}/iso/{{ iso_filename }}"
        state: link
        force: true
      become: true
      when: iso_use_tmpfs | bool

    - name: Copy local OEMDRV image to remote HTTP server image subdirectory for each host
      ansible.posix.synchronize:
        src: "{{ local_workspace }}/{{ hostvars[item].host.hostname }}-{{ img_filename }}"
        dest: "{{ remote_http_user }}@{{ remote_http_host }}:{{ remote_http_docroot }}/image/{{ hostvars[item].host.hostname }}/{{ img_filename }}"
        rsync_opts:
          - "--chmod=0644"
      become: true
      loop: "{{ groups['infra_servers'] }}"

    # =====================================================================
    # --- SELINUX CONFIGURATION ---
    # =====================================================================

    - name: Update SELinux fcontext for the HTTP document root
      ansible.builtin.command:
        argv:
          - /usr/sbin/semanage
          - fcontext
          - -a
          - -t
          - httpd_sys_content_t
          - "{{ remote_http_docroot }}(/.*)?"
      become: true
      register: semanage_result
      # Prevent failure if the context is already defined from a previous run
      failed_when:
        - semanage_result.rc != 0
        - "'already defined' not in semanage_result.stderr and 'already exists' not in semanage_result.stderr"
      changed_when: semanage_result.rc == 0

    - name: Apply SELinux contexts using restorecon
      ansible.builtin.command:
        argv:
          - /usr/sbin/restorecon
          - -Rv
          - "{{ remote_http_docroot }}"
      become: true
      register: restorecon_result
      # Only register as "changed" if restorecon actually modified files (output is not empty)
      changed_when: restorecon_result.stdout | length > 0

- name: Prepare Virtual Media on iDRAC for Kickstart Installation
  hosts: infra_servers
  gather_facts: false

  tasks:
    # =====================================================================
    # --- IDRAC VIRTUAL MEDIA CONFIGURATION ---
    # =====================================================================

    - name: Mount ISO and IMG via iDRAC Virtual Media for each host
      dellemc.openmanage.idrac_virtual_media:
        idrac_ip: "{{ idrac_ip }}"
        idrac_user: "{{ idrac_user }}"
        idrac_password: "{{ idrac_password }}"
        validate_certs: false
        force: true
        virtual_media:
          - index: 1
            insert: true
            media_type: "DVD"
            image: "{{ http_server_base_url }}/iso/{{ iso_filename }}"
          - index: 2
            insert: true
            media_type: "USBStick"
            image: "{{ http_server_base_url }}/image/{{ host.hostname }}/{{ img_filename }}"
      delegate_to: localhost # Run from control node to the iDRAC IP
...
