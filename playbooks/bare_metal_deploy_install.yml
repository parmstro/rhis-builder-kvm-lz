---
- name: Boot Server to Virtual Media and Wait for OS Installation
  hosts: infra_servers
  connection: local
  gather_facts: false

  tasks:
    # --- Boot Override Configuration ---

    - name: Configure First Boot Device to Virtual CD (Boot Once)
      dellemc.openmanage.idrac_boot:
        idrac_ip: "{{ idrac_ip }}"
        idrac_user: "{{ idrac_user }}"
        idrac_password: "{{ idrac_password }}"
        validate_certs: false
        boot_source_override_mode: "uefi"
        boot_source_override_target: "cd"
        boot_source_override_enabled: "once"
      delegate_to: localhost

    # --- Power State Management ---

    - name: Attempt graceful restart via iDRAC
      dellemc.openmanage.redfish_powerstate:
        baseuri: "{{ idrac_ip }}"
        username: "{{ idrac_user }}"
        password: "{{ idrac_password }}"
        validate_certs: false
        reset_type: "GracefulRestart"
      delegate_to: localhost
      register: restart_result
      ignore_errors: true

    - name: Power on device if already powered off
      dellemc.openmanage.redfish_powerstate:
        baseuri: "{{ idrac_ip }}"
        username: "{{ idrac_user }}"
        password: "{{ idrac_password }}"
        validate_certs: false
        reset_type: "On"
      delegate_to: localhost
      when: "'already powered off' in restart_result.msg | lower"

    # --- OS Reachability Monitor ---

    - name: Wait for the newly installed OS to become reachable via SSH
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 22
        state: started
        # Wait 5 minutes (300 seconds) before polling to allow the install environment to load
        delay: 300
        # Allow up to 60 minutes (3600 seconds) for the kickstart installation to finish
        timeout: 3600
      delegate_to: localhost
...