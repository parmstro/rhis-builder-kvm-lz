---
- name: Prepare Live ISO for Bare Metal Disk Wipe
  hosts: localhost
  gather_facts: false

  tasks:
    # =====================================================================
    # --- LOCAL WORKSPACE VALIDATION ---
    # =====================================================================

    - name: Verify Live ISO exists locally
      ansible.builtin.stat:
        path: "{{ local_iso_path }}/{{ liveiso_filename }}"
      register: liveiso_stat
      failed_when: not liveiso_stat.stat.exists

    - name: Display Live ISO location
      ansible.builtin.debug:
        msg: "Live ISO found: {{ local_iso_path }}/{{ liveiso_filename }}"

- name: Transfer Live ISO to HTTP Server
  hosts: http_servers
  gather_facts: false

  tasks:
    # =====================================================================
    # --- ENSURE HTTP INFRASTRUCTURE EXISTS ---
    # =====================================================================

    - name: Ensure target HTTP document root exists
      ansible.builtin.file:
        path: "{{ remote_http_docroot }}"
        state: directory
        mode: '0755'
      become: true

    - name: Ensure target HTTP iso subdirectory exists
      ansible.builtin.file:
        path: "{{ remote_http_docroot }}/iso"
        state: directory
        mode: '0755'
      become: true

    # =====================================================================
    # --- TRANSFER LIVE ISO TO HTTP SERVER ---
    # =====================================================================

    - name: Copy Live ISO to remote HTTP server iso subdirectory
      ansible.posix.synchronize:
        src: "{{ local_iso_path }}/{{ liveiso_filename }}"
        dest: "{{ remote_http_user }}@{{ remote_http_host }}:{{ remote_http_docroot }}/iso/{{ liveiso_filename }}"
        rsync_opts:
          - "--chmod=0644"
      become: true

    # =====================================================================
    # --- TMPFS OPTIMIZATION (OPTIONAL) ---
    # =====================================================================

    - name: Copy Live ISO to /dev/shm on remote HTTP server for tmpfs performance
      ansible.posix.synchronize:
        src: "{{ local_iso_path }}/{{ liveiso_filename }}"
        dest: "{{ remote_http_user }}@{{ remote_http_host }}:/dev/shm/{{ liveiso_filename }}"
        rsync_opts:
          - "--chmod=0644"
      become: true
      when: iso_use_tmpfs | default(false) | bool

    - name: Create symlink from HTTP docroot to Live ISO in /dev/shm
      ansible.builtin.file:
        src: "/dev/shm/{{ liveiso_filename }}"
        dest: "{{ remote_http_docroot }}/iso/{{ liveiso_filename }}"
        state: link
        force: true
      become: true
      when: iso_use_tmpfs | default(false) | bool

    # =====================================================================
    # --- SELINUX CONFIGURATION ---
    # =====================================================================

    - name: Update SELinux fcontext for the HTTP document root
      ansible.builtin.command:
        argv:
          - /usr/sbin/semanage
          - fcontext
          - -a
          - -t
          - httpd_sys_content_t
          - "{{ remote_http_docroot }}(/.*)?"
      become: true
      register: semanage_result
      # Prevent failure if the context is already defined from a previous run
      failed_when:
        - semanage_result.rc != 0
        - "'already defined' not in semanage_result.stderr and 'already exists' not in semanage_result.stderr"
      changed_when: semanage_result.rc == 0

    - name: Apply SELinux contexts using restorecon
      ansible.builtin.command:
        argv:
          - /usr/sbin/restorecon
          - -Rv
          - "{{ remote_http_docroot }}"
      become: true
      register: restorecon_result
      # Only register as "changed" if restorecon actually modified files (output is not empty)
      changed_when: restorecon_result.stdout | length > 0

- name: Configure iDRAC Virtual Media for Live ISO
  hosts: infra_servers
  gather_facts: false

  tasks:
    # =====================================================================
    # --- PRE-FLIGHT SAFETY CHECK ---
    # =====================================================================

    - name: Display hosts that will boot to Live ISO
      ansible.builtin.debug:
        msg: "Preparing Live ISO virtual media for {{ inventory_hostname }} ({{ ansible_host }})"

    # =====================================================================
    # --- IDRAC VIRTUAL MEDIA CONFIGURATION ---
    # =====================================================================

    - name: Mount Live ISO via iDRAC Virtual Media
      dellemc.openmanage.idrac_virtual_media:
        idrac_ip: "{{ idrac_ip }}"
        idrac_user: "{{ idrac_user }}"
        idrac_password: "{{ idrac_password }}"
        validate_certs: false
        force: true
        virtual_media:
          - index: 1
            insert: true
            media_type: "DVD"
            image: "{{ http_server_base_url }}/iso/{{ liveiso_filename }}"
      delegate_to: localhost
...
