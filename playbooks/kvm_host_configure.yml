---
- name: Configure KVM Host Infrastructure
  hosts: infra_servers
  become: true
  gather_facts: true

  tasks:
    - name: Display host information
      ansible.builtin.debug:
        msg: "Configuring {{ host.hostname }}.{{ host.domain }} ({{ ansible_host }})"

    # =====================================================================
    # --- Red Hat Subscription Registration ---
    # =====================================================================

    - name: Register system with Red Hat Subscription Manager
      community.general.redhat_subscription:
        state: present
        org_id: "{{ host.org }}"
        activationkey: "{{ host.activation_key }}"
        force_register: false
      register: rhsm_register

    - name: Display subscription status
      ansible.builtin.debug:
        msg: "System registered: {{ rhsm_register.changed }}"

    # Ensure that the most up-to-date packages are applied
    - name: "Ensure the system is up to date" # noqa package-latest
      ansible.builtin.dnf:
        name: "*"
        state: latest

    # =====================================================================
    # --- Auto-detect NVMe Devices and Verify RAID Capability ---
    # =====================================================================

    - name: Detect NVMe devices and verify RAID capability
      ansible.builtin.include_tasks: ../tasks/detect_nvme_raid_devices.yml

    # =====================================================================
    # --- RAID Configuration ---
    # =====================================================================

    - name: Configure mdadm RAID 10 array
      ansible.builtin.include_tasks: ../tasks/setup_raid.yml
      tags:
        - raid
        - storage

    # =====================================================================
    # --- Libvirt Infrastructure Configuration ---
    # =====================================================================

    - name: Configure libvirt infrastructure
      ansible.builtin.include_tasks: ../tasks/setup_libvirt.yml
      tags:
        - libvirt
        - network
        - storage

    # =====================================================================
    # --- ISO Distribution for VM Deployment ---
    # =====================================================================

    - name: Ensure required packages for VM kickstart are installed
      ansible.builtin.dnf:
        name:
          - dosfstools
          - mtools
          - qemu-img
        state: present

    - name: Distribute RHEL ISO to hypervisors
      ansible.builtin.include_tasks: ../tasks/distribute_iso.yml
      tags:
        - iso
        - vm_prep

    # =====================================================================
    # --- System Performance Tuning ---
    # =====================================================================

    - name: Configure system performance tuning
      ansible.builtin.include_tasks: ../tasks/setup_performance_tuning.yml
      tags:
        - performance
        - tuning

    # =====================================================================
    # -- Enable Intel Virtualization Technology for Directed I/O (VT-d)  --
    # =====================================================================

    - name: Check for Intel VT-d IOMMU hardware capability via ACPI DMAR table
      ansible.builtin.stat:
        path: /sys/firmware/acpi/tables/DMAR
      register: intel_iommu_dmar

    - name: Display Intel IOMMU hardware capability status
      ansible.builtin.debug:
        msg: >-
          Intel VT-d (IOMMU):
          {{ 'Present - proceeding with configuration' if intel_iommu_dmar.stat.exists
          else 'Not present - skipping IOMMU configuration' }}

    - name: Enable Intel Virtualization Technology for Directed I/O (VT-d)
      ansible.builtin.include_tasks: ../tasks/setup_intel_iommu.yml
      when: intel_iommu_dmar.stat.exists
      tags:
        - performance
        - tuning

    # =====================================================================
    # --- Verification ---
    # =====================================================================

    - name: Verify RAID array status
      ansible.builtin.command: mdadm --detail /dev/{{ raid_name }}
      register: raid_status
      changed_when: false

    - name: Display RAID status
      ansible.builtin.debug:
        var: raid_status.stdout_lines

    - name: Verify RAID partitions
      ansible.builtin.command: parted -s /dev/{{ raid_name }} print
      register: partition_status
      changed_when: false

    - name: Display partition status
      ansible.builtin.debug:
        var: partition_status.stdout_lines

    - name: Verify LVM volume groups
      ansible.builtin.command: vgdisplay
      register: vg_status
      changed_when: false

    - name: Display VG status
      ansible.builtin.debug:
        var: vg_status.stdout_lines

    - name: Load VM definitions for verification
      ansible.builtin.include_vars:
        file: "{{ vm_vars_file }}"
        name: vm_definitions_verify

    - name: Detect filesystem mode usage for verification
      ansible.builtin.set_fact:
        verify_uses_filesystem_mode: >-
          {{ vm_definitions_verify.vms
          | selectattr('disks', 'defined')
          | map(attribute='disks')
          | flatten
          | selectattr('disk.volume_mode', 'defined')
          | selectattr('disk.volume_mode', 'equalto', 'filesystem')
          | list
          | length > 0 }}

    - name: Detect block mode usage for verification
      ansible.builtin.set_fact:
        verify_uses_block_mode: >-
          {{ vm_definitions_verify.vms
          | selectattr('disks', 'defined')
          | map(attribute='disks')
          | flatten
          | selectattr('disk.volume_mode', 'defined')
          | selectattr('disk.volume_mode', 'equalto', 'block')
          | list
          | length > 0 }}

    - name: "Ensure system services are enabled and started"
      ansible.builtin.systemd_service:
        name: "{{ virtualization_service }}"
        enabled: true
        state: started
      loop:
        - virtqemud.socket
        - virtqemud-ro.socket
        - virtqemud-admin.socket
        - virtnetworkd.socket
        - virtnetworkd-ro.socket
        - virtnetworkd-admin.socket
        - virtnodedevd.socket
        - virtnodedevd-ro.socket
        - virtnodedevd-admin.socket
        - virtnwfilterd.socket
        - virtnwfilterd-ro.socket
        - virtnwfilterd-admin.socket
        - virtsecretd.socket
        - virtsecretd-ro.socket
        - virtsecretd-admin.socket
        - virtstoraged.socket
        - virtstoraged-ro.socket
        - virtstoraged-admin.socket
        - libvirtd-tls.socket
      loop_control:
        loop_var: virtualization_service

    - name: "Validate virtualization services"
      ansible.builtin.command: "virt-host-validate"
      register: kvm_host_validate
      changed_when: kvm_host_validate.rc == 0

    - name: "Validate results"
      ansible.builtin.debug:
        var: kvm_host_validate

    - name: "Assertion"
      ansible.builtin.assert:
        that:
          - not "FAIL" in kvm_host_validate.stdout
        fail_msg: "Please see debug validate results above for specific failures or warnings"

    - name: Verify libvirt network status
      ansible.builtin.command: virsh net-info {{ libvirt_network_name }}
      register: net_status
      changed_when: false

    - name: Display libvirt network status
      ansible.builtin.debug:
        var: net_status.stdout_lines

    - name: Verify filesystem storage pool status
      ansible.builtin.command: virsh pool-info {{ libvirt_pool_filesystem_name }}
      register: pool_fs_status
      changed_when: false
      when: verify_uses_filesystem_mode | bool

    - name: Display filesystem storage pool status
      ansible.builtin.debug:
        var: pool_fs_status.stdout_lines
      when: verify_uses_filesystem_mode | bool

    - name: Verify block storage pool status
      ansible.builtin.command: virsh pool-info {{ libvirt_pool_block_name }}
      register: pool_block_status
      changed_when: false
      when: verify_uses_block_mode | bool

    - name: Display block storage pool status
      ansible.builtin.debug:
        var: pool_block_status.stdout_lines
      when: verify_uses_block_mode | bool

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "KVM Host Configuration Complete"
          - "=========================================="
          - "Host: {{ host.hostname }}.{{ host.domain }}"
          - "RAID: /dev/{{ raid_name }} (RAID {{ raid_level }})"
          - "LVM PV: /dev/{{ raid_name }}"
          - "Network: {{ libvirt_network_name }} (bridge: {{ libvirt_bridge_name }})"
          - "Storage Pools:"
          - >-
            - Filesystem: {{ libvirt_pool_filesystem_name if verify_uses_filesystem_mode else 'Not configured' }}
            ({{ libvirt_pool_filesystem_path if verify_uses_filesystem_mode else 'N/A' }})
          - >-
            - Block: {{ libvirt_pool_block_name if verify_uses_block_mode else 'Not configured' }}
            (VG: {{ lvm_vg_block_name if verify_uses_block_mode else 'N/A' }})
          - "Tuned Profile: {{ tuned_active.stdout }}"
          - "=========================================="

  handlers:
    - name: KVM module reload required
      ansible.builtin.debug:
        msg: "WARNING: KVM module parameters changed. Reload requires stopping all VMs and running 'rmmod kvm && modprobe kvm'"

    - name: Libvirtd restart required
      ansible.builtin.debug:
        msg: "WARNING: libvirt qemu.conf changed. Restart libvirtd requires stopping all VMs and running 'systemctl restart libvirtd'"
...
