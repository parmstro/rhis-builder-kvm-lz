---
# =====================================================================
# NVMe Device Auto-Detection and RAID Capability Verification
# =====================================================================
# This task file detects Dell DC NVMe devices and verifies RAID 10
# capability (minimum 4 disks required).
#
# If host.additional_disks is not defined in host_vars, it will be
# auto-populated from detected devices. If already defined, host_vars
# takes precedence.
# =====================================================================

- name: Detect Dell DC NVMe SSD devices
  ansible.builtin.shell: |
    set -o pipefail
    find /dev/disk/by-id -name "*Dell_DC_NVMe*" 2>/dev/null | \
      grep -E -v 'part|scsi' | grep -v '_1$' | xargs readlink -f | sort
  register: detected_nvme_devices
  changed_when: false
  failed_when: false

- name: Set additional_disks from auto-detection if not defined
  ansible.builtin.set_fact:
    host: "{{ host | combine({'additional_disks': detected_nvme_devices.stdout_lines | map('regex_replace', '^', 'disk/by-id/') | list}, recursive=true) }}"
  when:
    - host.additional_disks is not defined
    - detected_nvme_devices.rc == 0
    - detected_nvme_devices.stdout_lines | length >= 4

- name: Display disk source
  ansible.builtin.debug:
    msg: >-
      Disk source: {{ 'Auto-detected Dell DC NVMe'
      if (host.additional_disks is defined and detected_nvme_devices.rc == 0
      and detected_nvme_devices.stdout_lines | length >= 4
      and host_original_additional_disks is not defined)
      else 'Configured from host_vars' }}
  vars:
    host_original_additional_disks: "{{ lookup('vars', 'host', default={}).get('additional_disks', None) }}"

- name: Verify additional disks are defined
  ansible.builtin.assert:
    that:
      - host.additional_disks is defined
      - host.additional_disks | length >= 4
    fail_msg: "RAID 10 requires at least 4 disks. Found {{ host.additional_disks | default([]) | length }} disks."
    success_msg: "Found {{ host.additional_disks | length }} disks for RAID 10 array."

- name: Display RAID configuration
  ansible.builtin.debug:
    msg:
      - "RAID Level: {{ raid_level }}"
      - "RAID Name: {{ raid_name }}"
      - "Number of devices: {{ host.additional_disks | length }}"
      - "Devices:"
      - "{{ host.additional_disks }}"
...
