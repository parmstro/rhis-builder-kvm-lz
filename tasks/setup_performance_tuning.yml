---
# =====================================================================
# System Performance Tuning
# =====================================================================
# Configures KVM hypervisor performance settings following IBM KVM
# best practices:
#   - tuned virtual-host profile
#   - KVM module parameters (hpage, halt_poll_ns)
#   - Huge pages reservation (70% of total memory by default)
#   - CPU scheduler migration cost (if kernel supports it)
#   - cpuset cgroup controller disabled for CPU hotplug (cgroups v1 only)
#
# Handlers triggered here are defined in kvm_host_configure.yml:
#   - KVM module reload required
#   - Libvirtd restart required
# =====================================================================

# =====================================================================
# --- TUNED PROFILE ---
# =====================================================================

- name: Ensure tuned is installed
  ansible.builtin.dnf:
    name: tuned
    state: present

- name: Enable and start tuned service
  ansible.builtin.systemd:
    name: tuned
    enabled: true
    state: started

- name: Set tuned profile to virtual-host
  ansible.builtin.command: tuned-adm profile virtual-host
  register: tuned_profile_set
  changed_when: "'Tuning was successfully switched' in tuned_profile_set.stdout"

- name: Verify active tuned profile
  ansible.builtin.command: tuned-adm active
  register: tuned_active
  changed_when: false

- name: Display active tuned profile
  ansible.builtin.debug:
    msg: "{{ tuned_active.stdout }}"

# =====================================================================
# --- KVM MODULE PARAMETERS ---
# =====================================================================

- name: Configure KVM module parameters for performance
  ansible.builtin.lineinfile:
    path: /etc/modprobe.d/kvm.conf
    regexp: "^options kvm {{ item.key }}="
    line: "options kvm {{ item.key }}={{ item.value }}"
    create: true
    mode: '0644'
  loop:
    - key: "hpage"
      value: "1"
    - key: "halt_poll_ns"
      value: "{{ kvm_halt_poll_ns | default('50000') }}"
  notify: KVM module reload required

# =====================================================================
# --- HUGE PAGES ---
# =====================================================================

- name: Calculate huge pages count based on VM memory requirements
  ansible.builtin.set_fact:
    calculated_hugepages: "{{ ((ansible_memtotal_mb * 0.7) / 2) | int }}"

- name: Reserve huge pages for KVM guests
  ansible.posix.sysctl:
    name: vm.nr_hugepages
    value: "{{ hugepages_count | default(calculated_hugepages) }}"
    sysctl_set: true
    state: present
    reload: true

# =====================================================================
# --- CPU SCHEDULER ---
# =====================================================================

- name: Check if CPU scheduler migration cost parameter exists
  ansible.builtin.stat:
    path: /proc/sys/kernel/sched_migration_cost_ns
  register: sched_migration_cost_exists

- name: Configure CPU scheduler migration cost
  ansible.posix.sysctl:
    name: kernel.sched_migration_cost_ns
    value: "{{ sched_migration_cost_ns | default('500000') }}"
    sysctl_set: true
    state: present
    reload: true
  when: sched_migration_cost_exists.stat.exists

# =====================================================================
# --- CGROUP CONTROLLER ---
# =====================================================================

- name: Check cgroup version
  ansible.builtin.shell: |
    set -o pipefail
    if [ -f /sys/fs/cgroup/cgroup.controllers ]; then
      echo "v2"
    else
      echo "v1"
    fi
  register: cgroup_version
  changed_when: false

- name: Disable cpuset cgroup controller for CPU hotplug (cgroups v1 only)
  ansible.builtin.lineinfile:
    path: /etc/libvirt/qemu.conf
    regexp: "^cgroup_controllers ="
    line: 'cgroup_controllers = [ "cpu", "devices", "memory", "blkio", "cpuacct" ]'
    backup: true
  when: cgroup_version.stdout == "v1"
  notify: Libvirtd restart required

# =====================================================================
# --- VERIFICATION AND DISPLAY ---
# =====================================================================

- name: Verify huge pages configuration
  ansible.builtin.command: cat /proc/meminfo
  register: meminfo
  changed_when: false

- name: Display huge pages status
  ansible.builtin.debug:
    msg: "{{ meminfo.stdout_lines | select('search', 'HugePage') | list }}"

- name: Display KVM performance parameters
  ansible.builtin.debug:
    msg:
      - "KVM Performance Tuning:"
      - "  - Huge pages enabled: {{ hugepages_count | default(calculated_hugepages) }} pages"
      - "  - KVM halt_poll_ns: {{ kvm_halt_poll_ns | default('50000') }} ns"
      - >-
        - CPU scheduler migration cost: {{ sched_migration_cost_ns | default('500000') }} ns
        {{ '(configured)' if sched_migration_cost_exists.stat.exists else '(not available on this kernel)' }}
      - "  - Cgroup version: {{ cgroup_version.stdout }}"
      - "  - cpuset controller disabled: {{ 'Yes' if cgroup_version.stdout == 'v1' else 'N/A (cgroups v2)' }}"
...
